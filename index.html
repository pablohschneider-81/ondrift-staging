}

function buildCoachSquad() {
  const d = document.createElement('div');
  const st = document.createElement('div'); st.className = 'section-title'; st.textContent = 'Escuadra';
  d.appendChild(st);
  const athletes = getAthletes();

  // ── Cargar historial de todos + asistencia (una sola vez por sesión de la app) ──
  if (!DATA.allHistLoaded || !DATA.attendancePct || !DATA.attendanceSum || !DATA.teamWellHist) {
    Promise.all([
      DATA.teamWellHist ? Promise.resolve() : dbGetTeamWellness(28).then(function(m) { DATA.teamWellHist = m; }).catch(function() { DATA.teamWellHist = {}; }),
      DATA.allHistLoaded ? Promise.resolve() : dbGetAllAthleteHist().then(function(map) {
        Object.keys(map).forEach(function(name) { DATA.athleteHist[name] = map[name]; });
        DATA.allHistLoaded = true;
      }),
      DATA.attendancePct ? Promise.resolve() : dbGetAttendancePct().then(function(map) { DATA.attendancePct = map; }),
      DATA.attendanceSum ? Promise.resolve() : dbGetAttendanceSummary().then(function(map) { DATA.attendanceSum = map; })
    ]).then(render);
    const loading = document.createElement('div'); loading.className = 'card';
    loading.innerHTML = '<div class="card-sub">Cargando carga de los últimos 28 días…</div>';
    d.appendChild(loading);
    return d;
  }

  const today = todayStr();
  const wellToday = getDayWellness(today);
  const rpeToday = getDayRPE(today);
  const slotsToday = daySlots(getSession(today));
  const adherence = athletes.map(function(name) {
    const w = wellToday[name] || null;
    const rpeEntry = normRPE(rpeToday[name]);
    const missing = [];
    if (!w) missing.push('Check-in');
    slotsToday.forEach(function(s) {
      if (!(rpeEntry && rpeEntry[s.slot])) missing.push('RPE ' + (SLOT_SHORT[s.slot] || s.slot));
    });
    return { name: name, missing: missing };
  }).sort(function(a, b) {
    const pa = a.missing.length > 0 ? 0 : 1, pb = b.missing.length > 0 ? 0 : 1;
    if (pa !== pb) return pa - pb;
    return a.name.localeCompare(b.name);
  });

  const pendingCount = adherence.filter(function(a){ return a.missing.length > 0; }).length;
  // La adherencia se arma aparte y se coloca al final de la pantalla.
  const adhWrap = document.createElement('div');
  const adhTitle = document.createElement('div'); adhTitle.className = 'section-title';
  adhTitle.textContent = 'Adherencia hoy' + (pendingCount > 0 ? ' · ' + pendingCount + ' pendiente' + (pendingCount !== 1 ? 's' : '') : ' · completo');
  adhWrap.appendChild(adhTitle);
  if (pendingCount > 0) {
    const pend = document.createElement('div');
    pend.style.cssText = 'font-size:0.75rem;font-weight:700;color:#c0392b;margin:-6px 0 12px;cursor:pointer';
    pend.textContent = '' + pendingCount + ' pendiente' + (pendingCount !== 1 ? 's' : '') + ' de check-in o RPE hoy · ver abajo ↓';
    pend.onclick = function() { adhWrap.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    d.appendChild(pend);
  }

  if (pendingCount === 0) {
    const ok = document.createElement('div'); ok.className = 'card';
    ok.style.cssText = 'padding:12px 14px;border:1px solid rgba(30,132,73,0.35);background:rgba(30,132,73,0.08)';
    ok.innerHTML = '<div style="font-size:0.85rem;color:#1e8449;font-weight:700">Todo el equipo completó check-in y RPE de hoy.</div>';
    adhWrap.appendChild(ok);
  } else {
    const adhCard = document.createElement('div'); adhCard.className = 'card'; adhCard.style.padding = '4px 0';
    adherence.filter(function(a){ return a.missing.length > 0; }).forEach(function(a, i) {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:9px 14px;' + (i > 0 ? 'border-top:1px solid rgba(100,140,180,0.12)' : '');
      row.innerHTML = '<span style="font-size:0.85rem;font-weight:600;color:#1a2a3a">' + escapeHtml(a.name) + '</span>' +
        '<span style="font-size:0.68rem;font-weight:700;color:#c0392b">' + a.missing.join(' · ') + '</span>';
      adhCard.appendChild(row);
    });
    adhWrap.appendChild(adhCard);
  }

  const acwrData = athletes.map(function(name) {
    return { name: name, raw: calcACWR(name), info: acwrLabel(calcACWR(name)) };
  }).filter(function(x){ return x.info !== null; });

  // Semáforo: riesgo primero, después atención, óptimo, subcarga, calibrando al final.
  // Dentro de cada zona, ratio descendente (más alto = más urgente de revisar).
  const ZONE_ORDER = { 'Riesgo': 0, 'Atención': 1, 'Óptimo': 2, 'Subcarga': 3, 'Calibrando': 4 };
  acwrData.sort(function(a, b) {
    const za = ZONE_ORDER[a.info.label], zb = ZONE_ORDER[b.info.label];
    if (za !== zb) return za - zb;
    const va = typeof a.raw === 'object' ? a.raw.value : a.raw;
    const vb = typeof b.raw === 'object' ? b.raw.value : b.raw;
    return vb - va;
  });

  d.appendChild(buildWellnessBlockA(acwrData));
  d.appendChild(buildSquadSummaryA(acwrData));

  const at = document.createElement('div'); at.className = 'section-title'; at.textContent = 'Carga · ACWR por atleta';
  d.appendChild(at);

  if (acwrData.length === 0) {
    const empty = document.createElement('div'); empty.className = 'card';
    empty.innerHTML = '<div class="card-sub">Sin datos suficientes todavía.</div>';
    d.appendChild(empty);
    const chartsE = buildSquadCharts(); if (chartsE) d.appendChild(chartsE);
    d.appendChild(adhWrap);
    return d;
  }

  const enRiesgo = acwrData.filter(function(x){ return x.info.label === 'Riesgo'; });
  if (enRiesgo.length > 0) {
    const alert = document.createElement('div'); alert.className = 'acwr-risk-alert';
    alert.style.cssText = 'background:rgba(231,76,60,0.12);border:1px solid rgba(231,76,60,0.4);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:0.78rem;color:#e74c3c;font-weight:700';
    alert.textContent = '' + enRiesgo.length + ' en zona de riesgo (>1.5): ' + enRiesgo.map(function(x){ return shortAthleteName(x.name); }).join(', ');
    d.appendChild(alert);
  }

  // Una tarjeta a lo ancho por atleta: nombre, zona y ACWR, barra de zonas y 4 casillas
  const zoneTint = { 'Riesgo': 'rgba(229,72,77,0.12)', 'Atención': 'rgba(217,119,6,0.13)', 'Óptimo': 'rgba(15,157,88,0.12)', 'Subcarga': 'rgba(10,132,255,0.1)', 'Calibrando': 'rgba(125,147,168,0.15)' };
  const zoneInk = { 'Riesgo': '#e5484d', 'Atención': '#d97706', 'Óptimo': '#0f9d58', 'Subcarga': '#0a84ff', 'Calibrando': '#7d93a8' };
  // Posición en la barra: subcarga 0–40 %, óptimo 40–65 %, atención 65–75 %, riesgo 75–100 % (hasta 2.0)
  const barPos = function(r) {
    if (r <= 0.8) return Math.max(2, r / 0.8 * 40);
    if (r <= 1.3) return 40 + (r - 0.8) / 0.5 * 25;
    if (r <= 1.5) return 65 + (r - 1.3) / 0.2 * 10;
    return Math.min(98, 75 + (r - 1.5) / 0.5 * 25);
  };
  const attColOf = function(p) { return p == null ? '#7d93a8' : p >= 85 ? '#0f9d58' : p >= 70 ? '#d97706' : '#e5484d'; };
  const attStrOf = function(p) { return p == null ? '—' : Math.round(p) + '%'; };
  const cards = document.createElement('div'); cards.className = 'acwr-g3';
  // Semáforo de cada dato: verde bien, naranja atención, rojo mal
  const okW = '#0f9d58', midW = '#d97706', badW = '#e5484d';
  const rpeDot = function(v) { return v == null ? null : v <= 5 ? okW : v <= 8 ? midW : badW; };
  const attDot = function(p) { return p == null ? null : p >= 85 ? okW : p >= 70 ? midW : badW; };
  if (!S.acwrOpen) S.acwrOpen = {};
  acwrData.forEach(function(x) {
    const isCal = x.info.calibrating;
    const num = isCal ? x.raw.value : x.raw;
    const est = acwrHasEstimated(x.name);
    const ink = zoneInk[x.info.label] || '#7d93a8';
    const hist = DATA.athleteHist[x.name] || [];
    const lastRpe = hist.length > 0 ? hist[hist.length - 1] : null; // hist viene asc por fecha
    const att = (DATA.attendanceSum || {})[x.name] || {};
    const ms = calcMonotonyStrain(x.name);
    const mLbl = ms ? monotonyLabel(ms.monotony) : null;
    const row = function(label, val, dot) {
      return '<div class="rw"' + (dot ? ' style="--dc:' + dot + '"' : '') + '>' + label + '<b>' + val + '</b></div>';
    };
    const extra = [];
    if (lastRpe) extra.push('Último RPE: ' + lastRpe.date.slice(5).split('-').reverse().join('/'));
    if (att.n_month) extra.push('Mes: ' + att.n_month + ' sesiones');
    if (att.n_total) extra.push('Total: ' + att.n_total + ' sesiones');
    if (mLbl) extra.push('Monotonía ' + mLbl.label.toLowerCase() + (ms && ms.strain != null ? ' · strain ' + ms.strain : ''));
    if (isCal) extra.push('Provisional: ' + x.raw.days + ' días con carga');
    if (est) extra.push('≈ incluye una sesión estimada en 80 min');

    const card = document.createElement('div');
    card.className = 'card acwr-c' + (S.acwrOpen[x.name] ? ' open' : '');
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-expanded', S.acwrOpen[x.name] ? 'true' : 'false');
    card.innerHTML =
      '<div class="nm">' + escapeHtml(shortAthleteName(x.name)) + '</div>' +
      '<div class="v" style="color:' + ink + '">' + Number(num).toFixed(2) + (isCal ? '<small>*</small>' : '') + (est ? '<small>≈</small>' : '') + '</div>' +
      '<div class="zl" style="color:' + ink + '">' + (isCal ? 'Provisional' : x.info.label) + '</div>' +
      '<div class="zb' + (isCal ? ' cal' : '') + '"><i style="left:' + barPos(num).toFixed(1) + '%"></i></div>' +
      row('RPE', lastRpe ? lastRpe.rpe : '—', rpeDot(lastRpe ? lastRpe.rpe : null)) +
      row('Monot.', ms ? (ms.flatWeek ? '∞' : ms.monotony) : '—', mLbl ? mLbl.color : null) +
      row('Mes', attStrOf(att.pct_month), attDot(att.pct_month)) +
      row('Total', attStrOf(att.pct_total), attDot(att.pct_total)) +
      (extra.length ? '<div class="more">' + extra.map(escapeHtml).join('<br>') + '</div>' : '');
    // Tocar la tarjeta muestra la fecha del último RPE y el resto del detalle
    const toggle = function() { S.acwrOpen[x.name] = !S.acwrOpen[x.name]; card.classList.toggle('open'); card.setAttribute('aria-expanded', S.acwrOpen[x.name] ? 'true' : 'false'); };
    card.onclick = toggle;
    card.onkeydown = function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };
    cards.appendChild(card);
  });

  // Título con "¿Qué significa?" que despliega la leyenda
  const titleRow = document.createElement('div'); titleRow.className = 'acwr-title-row';
  at.remove();
  at.textContent = 'ACWR por atleta';
  const legendBtn = document.createElement('button'); legendBtn.className = 'acwr-legend-btn';
  legendBtn.textContent = S.acwrLegendOpen ? 'Ocultar' : '¿Qué significa?';
  legendBtn.setAttribute('aria-expanded', S.acwrLegendOpen ? 'true' : 'false');
  legendBtn.onclick = function() { S.acwrLegendOpen = !S.acwrLegendOpen; render(); };
  titleRow.append(at, legendBtn);
  d.insertBefore(titleRow, d.querySelector('.acwr-risk-alert') || null);
  if (S.acwrLegendOpen) {
    const legend = document.createElement('div'); legend.className = 'card acwr-legend';
    legend.innerHTML = '<b>ACWR</b> (carga aguda ÷ crónica): <span style="color:#0a84ff">menos de 0.8 subcarga</span> · <span style="color:#0f9d58">0.8–1.3 óptimo</span> · <span style="color:#d97706">1.3–1.5 atención</span> · <span style="color:#e5484d">más de 1.5 riesgo</span>.<br>' +
      '<b>*</b> valor provisional: faltan ~3 semanas de datos para que sea fiable. <b>≈</b> incluye alguna sesión sin duración real (estimada en 80 min).<br>' +
      '<b>Monotonía</b> semanal (Foster): menos de 1.5 bien variada · 1.5–2.0 moderada · más de 2.0 alta, semana repetitiva incluso con ACWR óptimo.';
    titleRow.after(legend);
  }
  d.appendChild(cards);

  const charts = buildSquadCharts(); if (charts) d.appendChild(charts);
  d.appendChild(adhWrap);

  return d;
}

// Gráficos de la planificación del entrenador (no del RPE de los nadadores):
// volumen diario en metros e intensidad planificada (RPE objetivo), últimos 14 días.
function buildSquadCharts() {
  const days21 = [];
  for (let i = 20; i >= 0; i--) {
    const dt = new Date(); dt.setDate(dt.getDate() - i);
    const ds = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
    const slots = daySlots(getSession(ds));
    let meters = 0, fondoM = 0, mins = 0, load = 0;
    slots.forEach(function(s) {
      const vb = volumeBreakdown(s.sess);
      const g = vb ? ((vb.hasFondo && !vb.hasGrupo) ? vb.fondo : vb.grupo) : 0;
      meters += g; fondoM += vb ? (vb.hasFondo ? vb.fondo : g) : 0;
      const dur = s.sess.duration || 80, t = s.sess.targetRPE || 0;
      mins += dur; load += t * dur;
    });
    days21.push({ date: ds, meters: meters, fondo: fondoM, rpe: mins > 0 ? Math.round((load / mins) * 10) / 10 : null, n: slots.length });
  }
  const days = days21.slice(-14);
  if (!days.some(function(x){ return x.n > 0; })) return null;

  const wrap = document.createElement('div');
  const W = 320, H = 150, PAD = { top: 18, right: 10, bottom: 24, left: 30 };
  const iW = W - PAD.left - PAD.right, iH = H - PAD.top - PAD.bottom;
  const bw = iW / days.length;
  const xl = function(i) { const dt = dateObj(days[i].date); return '<text x="' + (PAD.left + bw * i + bw / 2) + '" y="' + (H - 6) + '" font-size="8" fill="#3a5a7a" text-anchor="middle">' + dt.getDate() + '/' + (dt.getMonth() + 1) + '</text>'; };
  const xLabels = days.map(function(x, i) { return (i % 2 === 1 || i === days.length - 1) ? xl(i) : ''; }).join('');
  const mkCard = function(svgHtml, noteTxt) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('width', '100%'); svg.setAttribute('height', H);
    svg.innerHTML = svgHtml;
    const card = document.createElement('div'); card.className = 'card';
    card.style.cssText = 'padding:12px 8px;background:rgba(255,255,255,0.65);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.82);box-shadow:0 2px 16px rgba(100,140,180,0.15),inset 0 1px 0 rgba(255,255,255,0.9)';
    card.appendChild(svg);
    if (noteTxt) { const n = document.createElement('div'); n.style.cssText = 'font-size:0.68rem;color:var(--text2);padding:4px 8px 0'; n.textContent = noteTxt; card.appendChild(n); }
    return card;
  };

  // ── Volumen (21 días) ──
  const vd = days21;
  const sum7 = vd.slice(-7).reduce(function(a, x){ return a + x.meters; }, 0);
  const prev7 = vd.slice(-14, -7).reduce(function(a, x){ return a + x.meters; }, 0);
  const fmt = function(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); };
  const delta = prev7 > 0 ? ' (' + (sum7 >= prev7 ? '+' : '') + Math.round((sum7 / prev7 - 1) * 100) + '%)' : '';
  const hasF = vd.some(function(x){ return x.fondo !== x.meters; });
  const sum7F = vd.slice(-7).reduce(function(a, x){ return a + x.fondo; }, 0);
  const prev7F = vd.slice(-14, -7).reduce(function(a, x){ return a + x.fondo; }, 0);
  const deltaF = prev7F > 0 ? ' (' + (sum7F >= prev7F ? '+' : '') + Math.round((sum7F / prev7F - 1) * 100) + '%)' : '';
  const maxM = Math.max.apply(null, vd.map(function(x){ return Math.max(x.meters, x.fondo); }).concat([1]));
  const yMax = Math.ceil(maxM / 1000) * 1000;
  const yv = function(m) { return PAD.top + iH - (m / yMax) * iH; };
  const grid = [0.5, 1].map(function(f) { const m = yMax * f; return '<line x1="' + PAD.left + '" y1="' + yv(m) + '" x2="' + (PAD.left + iW) + '" y2="' + yv(m) + '" stroke="rgba(100,140,180,0.18)" stroke-width="1"/><text x="' + (PAD.left - 5) + '" y="' + (yv(m) + 3) + '" font-size="9" fill="#3a5a7a" text-anchor="end">' + (m / 1000).toFixed(m % 1000 ? 1 : 0) + 'k</text>'; }).join('');
  // Misma estética que el gráfico de RPE del atleta: curva suave, área y puntos (sin barras).
  const nPts = vd.length;
  const xp = function(i) { return PAD.left + 8 + (i / (nPts - 1)) * (iW - 16); };
  const pts = vd.map(function(x, i) { return { x: xp(i), y: yv(x.meters) }; });
  const curve = function(close, arr) {
    arr = arr || pts;
    let p = 'M' + arr[0].x + ' ' + arr[0].y;
    for (let i = 1; i < arr.length; i++) {
      const cx = (arr[i - 1].x + arr[i].x) / 2;
      p += ' C' + cx + ' ' + arr[i - 1].y + ' ' + cx + ' ' + arr[i].y + ' ' + arr[i].x + ' ' + arr[i].y;
    }
    if (close) p += ' L' + arr[nPts - 1].x + ' ' + (PAD.top + iH) + ' L' + arr[0].x + ' ' + (PAD.top + iH) + ' Z';
    return p;
  };
  const ptsF = vd.map(function(x, i) { return { x: xp(i), y: yv(x.fondo) }; });
  const xLabelsV = vd.map(function(x, i) {
    if ((nPts - 1 - i) % 3 !== 0) return '';
    const dt = dateObj(x.date);
    return '<text x="' + xp(i) + '" y="' + (H - 6) + '" font-size="8" fill="#3a5a7a" text-anchor="middle">' + dt.getDate() + '/' + (dt.getMonth() + 1) + '</text>';
  }).join('');
  // Ayudas de los gráficos: al tocar un punto o barra, su valor aparece en la línea de arriba
  const dayLbl = function(ds) { const d = dateObj(ds); return DAYS_ES[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS_ES[d.getMonth()].slice(0, 3).toLowerCase(); };
  const letters = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
  const wireTips = function(card, readout, def) {
    readout.innerHTML = def;
    card.addEventListener('click', function(e) {
      const t = e.target.closest('[data-tip]');
      readout.innerHTML = t ? t.getAttribute('data-tip') : def;
    });
  };
  const tipAttr = function(html) { return ' data-tip="' + html.replace(/"/g, '&quot;') + '"'; };
  const dotsV = vd.map(function(x, i) {
    const tip = tipAttr('<b>' + dayLbl(x.date) + '</b> · ' + (x.meters > 0 ? fmt(x.meters) + ' m' : 'sin metros') + (hasF && x.fondo !== x.meters && x.fondo > 0 ? ' · Fondo ' + fmt(x.fondo) + ' m' : ''));
    const dot = x.meters <= 0
      ? '<circle cx="' + pts[i].x + '" cy="' + pts[i].y + '" r="2.5" fill="#1a6fa8" opacity="0.5"/>'
      : '<circle cx="' + pts[i].x + '" cy="' + pts[i].y + '" r="4" fill="#1a6fa8" stroke="white" stroke-width="2"/>';
    return dot + '<circle' + tip + ' cx="' + pts[i].x + '" cy="' + pts[i].y + '" r="11" fill="transparent"/>';
  }).join('');
  // Fondo (solo si hay días con variante distinta): punto y etiqueta en dorado
  const dotsF = !hasF ? '' : vd.map(function(x, i) {
    if (x.fondo === x.meters || x.fondo <= 0) return '';
    return '<circle cx="' + ptsF[i].x + '" cy="' + ptsF[i].y + '" r="3.5" fill="#c8920a" stroke="white" stroke-width="2"/>';
  }).join('');
  // Tendencia: una recta de regresión por semana (bloques de 7 días que terminan hoy); pendiente en km/día
  let trendV = '';
  const weekSlopes = [], weekSums = [];
  for (let k = 0; k < 3; k++) {
    const i0 = k * 7, ys = [];
    for (let j = 0; j < 7; j++) ys.push(vd[i0 + j].meters / 1000);
    const my = ys.reduce(function(a, b){ return a + b; }, 0) / 7;
    let num = 0, den = 0;
    for (let j = 0; j < 7; j++) { num += (j - 3) * (ys[j] - my); den += (j - 3) * (j - 3); }
    const m = num / den, c = my - m * 3;
    const x1 = xp(i0), x2 = xp(i0 + 6), y1 = yv((c) * 1000), y2 = yv((c + m * 6) * 1000);
    weekSlopes.push(m); weekSums.push(vd.slice(i0, i0 + 7).reduce(function(a, x){ return a + x.meters; }, 0));
    if (k < 2) trendV += '<line x1="' + ((xp(i0 + 6) + xp(i0 + 7)) / 2) + '" y1="' + (PAD.top - 4) + '" x2="' + ((xp(i0 + 6) + xp(i0 + 7)) / 2) + '" y2="' + (PAD.top + iH) + '" stroke="rgba(100,140,180,0.45)" stroke-width="0.8" stroke-dasharray="1 3"/>';
  }
  const lineV = '<defs><linearGradient id="volGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a6fa8" stop-opacity="0.35"/><stop offset="100%" stop-color="#1a6fa8" stop-opacity="0.03"/></linearGradient></defs>'
    + '<path d="' + curve(true) + '" fill="url(#volGrad)"/>'
    + (hasF ? '<path d="' + curve(false, ptsF) + '" fill="none" stroke="#c8920a" stroke-width="2" stroke-dasharray="5 3" stroke-linecap="round" stroke-linejoin="round"/>' : '')
    + '<path d="' + curve(false) + '" fill="none" stroke="#1a4a7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
    + trendV + dotsV + dotsF;
  const t1 = document.createElement('div'); t1.className = 'section-title'; t1.textContent = 'Volumen · 21 días';
  wrap.appendChild(t1);
  const cV = mkCard(grid + xLabelsV + lineV, hasF
    ? 'Azul: Grupo · dorado discontinuo: Fondo (últimos 7 días ' + fmt(sum7F) + ' m' + deltaF + '). Los turnos de Físico no suman metros.'
    : 'Los turnos de Físico no suman metros.');
  cV.classList.add('chart-a');
  const roV = document.createElement('div'); roV.className = 'readout';
  cV.insertBefore(roV, cV.firstChild);
  const wkNames = ['Hace 2 sem.', 'Sem. pasada', 'Últimos 7 días'];
  const chipsV = document.createElement('div'); chipsV.className = 'chips';
  chipsV.innerHTML = wkNames.map(function(n, k) {
    const m = weekSlopes[k];
    const col = m > 0.05 ? 'var(--green)' : (m < -0.05 ? 'var(--orange)' : 'var(--text2)');
    return '<div>' + n + '<b>' + (weekSums[k] / 1000).toFixed(1).replace('.', ',') + ' km</b><small style="color:' + col + '">'
      + (m > 0.05 ? '↗' : (m < -0.05 ? '↘' : '→')) + ' ' + (m >= 0 ? '+' : '') + m.toFixed(2).replace('.', ',') + ' km/día</small></div>';
  }).join('');
  cV.insertBefore(chipsV, cV.lastChild);
  wireTips(cV, roV, 'Toca un punto para ver los metros de ese día');
  wrap.appendChild(cV);

  const WI = 330, leftI = 30;

  // ── Intensidad planificada: barras con el color del RPE objetivo ──
  const H2 = 120, top2 = 8, bottom2 = 100;
  const bw2 = (WI - leftI) / days.length;
  const yr = function(v) { return bottom2 - ((v) / 10) * (bottom2 - top2); };
  let svgR = '';
  [5, 10].forEach(function(v) {
    svgR += '<line x1="' + leftI + '" x2="' + WI + '" y1="' + yr(v) + '" y2="' + yr(v) + '" stroke="rgba(74,106,134,0.16)" stroke-dasharray="3 4"/><text x="' + (leftI - 5) + '" y="' + (yr(v) + 3) + '" font-size="8" fill="#7d93a8" text-anchor="end">' + v + '</text>';
  });
  svgR += '<line x1="' + leftI + '" x2="' + WI + '" y1="' + bottom2 + '" y2="' + bottom2 + '" stroke="rgba(74,106,134,0.28)"/>';
  let rSum = 0, rN = 0;
  days.forEach(function(x, i) {
    const bx = leftI + bw2 * i + bw2 * 0.18, bwi = bw2 * 0.64;
    const d = dateObj(x.date);
    svgR += '<text x="' + (bx + bwi / 2).toFixed(1) + '" y="' + (H2 - 6) + '" font-size="8" fill="#7d93a8" text-anchor="middle">' + letters[d.getDay()] + '</text>';
    if (x.rpe == null) return;
    rSum += x.rpe; rN++;
    const tip = '<b>' + dayLbl(x.date) + '</b> · RPE objetivo ' + x.rpe + (x.n > 1 ? ' (' + x.n + ' turnos)' : '');
    svgR += '<rect data-tip="' + tip.replace(/"/g, '&quot;') + '" x="' + bx.toFixed(1) + '" y="' + yr(x.rpe).toFixed(1) + '" width="' + bwi.toFixed(1) + '" height="' + (bottom2 - yr(x.rpe)).toFixed(1) + '" rx="3" fill="' + rpeColor(Math.round(x.rpe)) + '"' + (i === days.length - 1 ? ' stroke="#0b2236" stroke-width="1.2"' : '') + '/>';
  });
  const t2 = document.createElement('div'); t2.className = 'section-title'; t2.style.marginTop = '14px'; t2.textContent = 'Intensidad planificada · 14 días';
  wrap.appendChild(t2);
  const cR = document.createElement('div'); cR.className = 'card chart-a';
  const roR = document.createElement('div'); roR.className = 'readout';
  cR.appendChild(roR);
  const svgEl2 = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svgEl2.setAttribute('viewBox', '0 0 ' + WI + ' ' + H2); svgEl2.innerHTML = svgR;
  cR.appendChild(svgEl2);
  const lg = document.createElement('div'); lg.className = 'legend';
  lg.innerHTML = '<span><i style="background:' + rpeColor(2) + '"></i>Suave 1–3</span><span><i style="background:' + rpeColor(5) + '"></i>Media 4–5</span><span><i style="background:' + rpeColor(6) + '"></i>6</span><span><i style="background:' + rpeColor(8) + '"></i>Dura 7–8</span><span><i style="background:' + rpeColor(10) + '"></i>Máx. 9–10</span>'
    + (rN ? '<span style="margin-leftI:auto">Media: <b style="color:var(--text)">' + (rSum / rN).toFixed(1).replace('.', ',') + '</b></span>' : '');
  cR.appendChild(lg);
  const noteR = document.createElement('div'); noteR.className = 'note';
  noteR.textContent = 'RPE objetivo que pones en cada sesión. En días con varios turnos, media ponderada por duración.';
  cR.appendChild(noteR);
  wireTips(cR, roR, 'Toca una barra para ver el RPE de ese día');
  wrap.appendChild(cR);
  return wrap;
}

// ============================================================
// CALENDAR (shared)
// ============================================================
function buildCalendar() {
  const isCoach = S.role === 'coach';
  const d = document.createElement('div');
  const st = document.createElement('div'); st.className = 'section-title'; st.textContent = 'Calendario';
  d.appendChild(st);
  const today = new Date();
  const year = S.calYear, month = S.calMonth;
  const competitions = getCompetitions();

  // Header
  const ch = document.createElement('div'); ch.className = 'cal-header';
  const prev = document.createElement('button'); prev.className = 'cal-nav'; prev.textContent = '‹';
  prev.onclick = () => {
    S.calMonth--; if(S.calMonth<0){S.calMonth=11;S.calYear--;}
    const ym = S.calYear + '-' + String(S.calMonth+1).padStart(2,'0');
    if (!_loadedMonths[ym]) dbLoadSessionMonth(ym).then(render); else render();
  };
  const mnth = document.createElement('span');
  mnth.style.cssText = 'font-weight:700;font-size:1rem;color:var(--text);';
  mnth.textContent = MONTHS_ES[month] + ' ' + year;
  const next = document.createElement('button'); next.className = 'cal-nav'; next.textContent = '›';
  next.onclick = () => {
    S.calMonth++; if(S.calMonth>11){S.calMonth=0;S.calYear++;}
    const ym = S.calYear + '-' + String(S.calMonth+1).padStart(2,'0');
    if (!_loadedMonths[ym]) dbLoadSessionMonth(ym).then(render); else render();
  };
  ch.append(prev, mnth, next);
  d.appendChild(ch);

  // Grid
  const grid = document.createElement('div'); grid.className = 'cal-grid';
  ['L','M','X','J','V','S','D'].forEach(d2 => {
    const dh = document.createElement('div'); dh.className = 'cal-dh'; dh.textContent = d2; grid.appendChild(dh);
  });

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const startOffset = firstDay === 0 ? 6 : firstDay - 1;
  const prevMonthDays = new Date(year, month, 0).getDate();

  // Build date sets
  const sessKeys = new Set();
  Object.keys(DATA.sessions || {}).forEach(function(ds){ sessKeys.add(ds); });

  const compDates = new Map();
  competitions.forEach(c => {
    const start = new Date(c.start+'T12:00:00'), end = new Date(c.end+'T12:00:00');
    for (let dt = new Date(start); dt <= end; dt.setDate(dt.getDate()+1)) {
      const ds = dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
      compDates.set(ds, c.type);
    }
  });

  for (let i = 0; i < startOffset; i++) {
    const cell = document.createElement('div'); cell.className = 'cal-day other-month';
    cell.textContent = prevMonthDays - startOffset + i + 1; grid.appendChild(cell);
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const ds = year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const cell = document.createElement('div'); cell.className = 'cal-day';
    cell.textContent = day;
    if (year===today.getFullYear()&&month===today.getMonth()&&day===today.getDate()) cell.classList.add('today');
    if (compDates.has(ds)) {
      const cc = compColor(compDates.get(ds));
      cell.style.background = cc;
      cell.style.color = contrastText(cc);
      cell.style.fontWeight = '700';
      cell.style.border = '1px solid ' + cc;
      cell.style.boxShadow = '0 2px 6px ' + cc + '55';
    }
    else if (sessKeys.has(ds)) cell.classList.add('has-session');
    grid.appendChild(cell);
  }
  const remaining = 42 - startOffset - daysInMonth;
  for (let i = 1; i <= remaining && remaining < 14; i++) {
    const cell = document.createElement('div'); cell.className = 'cal-day other-month'; cell.textContent = i; grid.appendChild(cell);
  }
  d.appendChild(grid);

  // Legend
  const leg = document.createElement('div'); leg.style.cssText='display:flex;gap:10px;margin:10px 0;font-size:0.68rem;color:var(--text2);flex-wrap:wrap';
  let legHtml = '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent2);margin-right:4px"></span>Sesión</span>';
  COMP_TYPES.forEach(function(t) {
    legHtml += '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + compColor(t) + ';margin-right:4px"></span>' + t + '</span>';
  });
  leg.innerHTML = legHtml;
  d.appendChild(leg);

  // Month competitions
  const monthComps = competitions.filter(c => {
    const s = new Date(c.start+'T12:00:00'), e = new Date(c.end+'T12:00:00');
    return (s.getFullYear()===year&&s.getMonth()===month)||(e.getFullYear()===year&&e.getMonth()===month);
  });
  if (monthComps.length > 0) {
    const st2Wrap = document.createElement('div');
    st2Wrap.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-top:16px';
    const st2 = document.createElement('div'); st2.className = 'section-title'; st2.textContent = 'Competiciones';
    st2Wrap.appendChild(st2);
    if (isCoach) {
      const selToggle = document.createElement('button');
      selToggle.className = 'btn-del';
      selToggle.style.cssText = 'padding:4px 10px;font-size:0.72rem';
      selToggle.textContent = S.compSelMode ? 'Cancelar' : 'Seleccionar';
      selToggle.onclick = function() {
        S.compSelMode = !S.compSelMode;
        S.compSel = [];
        render();
      };
      st2Wrap.appendChild(selToggle);
    }
    d.appendChild(st2Wrap);

    // Barra de borrado en bloque — solo visible en modo selección con algo marcado
    if (isCoach && S.compSelMode && S.compSel.length > 0) {
      const bulkBar = document.createElement('div');
      bulkBar.style.cssText = 'display:flex;align-items:center;justify-content:space-between;background:rgba(192,57,43,0.12);border:1px solid rgba(192,57,43,0.4);border-radius:10px;padding:8px 12px;margin:8px 0';
      const cnt = document.createElement('span');
      cnt.style.cssText = 'font-size:0.82rem;font-weight:700;color:var(--accent2)';
      cnt.textContent = S.compSel.length + ' seleccionada' + (S.compSel.length !== 1 ? 's' : '');
      const bulkBtn = document.createElement('button');
      bulkBtn.className = 'btn btn-danger';
      bulkBtn.style.cssText = 'padding:8px 14px;font-size:0.82rem';
      bulkBtn.textContent = 'Borrar seleccionadas';
      bulkBtn.onclick = function() {
        const ids = S.compSel.slice();
        showConfirm(
          '¿Borrar ' + ids.length + (ids.length === 1 ? ' competición' : ' competiciones') + '?',
          'No se puede deshacer.',
          function() {
            bulkBtn.disabled = true; bulkBtn.textContent = 'Borrando…';
            Promise.all(ids.map(function(id) { return dbDeleteCompetition(id); })).then(function() {
              S.compSel = []; S.compSelMode = false;
              renderAsync();
            });
          }
        );
      };
      bulkBar.append(cnt, bulkBtn);
      d.appendChild(bulkBar);
    }

    const compsContainer = document.createElement('div'); compsContainer.className = 'comps-container'; d.appendChild(compsContainer);
    compsContainer.addEventListener('click', function(e) {
      const delBtn = e.target.closest('.comp-del');
      if (delBtn) {
        const idx2 = parseInt(delBtn.dataset.idx);
        const comp2 = DATA.competitions[idx2];
        if (comp2) {
          showConfirm('¿Borrar "' + comp2.name + '"?', 'No se puede deshacer.', function() {
            dbDeleteCompetition(comp2.id).then(function() { renderAsync(); });
          });
        }
        return;
      }
      const chk = e.target.closest('.comp-sel-chk');
      if (chk) {
        const id = chk.dataset.id;
        const i = S.compSel.indexOf(id);
        if (i === -1) S.compSel.push(id); else S.compSel.splice(i, 1);
        render();
        return;
      }
    });
    monthComps.forEach((c, compIdx) => {
      const ci = document.createElement('div'); ci.className = 'comp-item';
      ci.style.borderColor = compColor(c.type) + '66';
      ci.style.background = compColor(c.type) + '14';
      const mapsUrl = c.location
        ? 'https://maps.apple.com/?q=' + encodeURIComponent(c.location)
        : null;
      const mapSquare = c.location
        ? '<a href="' + mapsUrl + '" target="_blank" style="flex-shrink:0;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:96px;background:#1a3a6b;border:none;border-left:1px solid rgba(192,57,43,0.3);border-radius:0 7px 7px 0;text-decoration:none;padding:0 8px;margin:-10px -14px -10px 8px">'
          + '<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#e74c3c\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z\"></path><circle cx=\"12\" cy=\"10\" r=\"3\"></circle></svg>'
          + '<span style="font-size:0.6rem;color:var(--accent2);font-weight:700;text-align:center;line-height:1.3">Abrir<br>Maps</span>'
          + '</a>'
        : '';
      const checkboxHtml = (isCoach && S.compSelMode)
        ? '<div class="comp-sel-chk" data-id="' + c.id + '" style="flex-shrink:0;align-self:flex-start;width:22px;height:22px;border-radius:6px;border:2px solid ' + compColor(c.type) + ';display:flex;align-items:center;justify-content:center;margin-right:10px;cursor:pointer;background:' + (S.compSel.indexOf(String(c.id)) !== -1 || S.compSel.indexOf(c.id) !== -1 ? compColor(c.type) : 'transparent') + '">'
          + ((S.compSel.indexOf(String(c.id)) !== -1 || S.compSel.indexOf(c.id) !== -1) ? '<span style="color:#fff;font-size:0.8rem;font-weight:900">✓</span>' : '')
          + '</div>'
        : '';
      ci.innerHTML =
        '<div style="display:flex;align-items:stretch;gap:0">'
        + checkboxHtml
        + '<div style="flex:1;min-width:0">'
        + '<div class="comp-name">' + escapeHtml(c.name) + '</div>'
        + '<div class="comp-sub">' + formatDateLabel(c.start) + ' → ' + formatDateLabel(c.end) + '</div>'
        + (c.location ? '<div class="comp-sub" style="margin-top:2px">' + c.location + '</div>' : '')
        + '<div style="margin-top:8px;display:flex;align-items:center;gap:8px">'
        + '<span class="comp-badge" style="background:' + compColor(c.type) + ';color:' + contrastText(compColor(c.type)) + '">' + c.type + '</span>'
        + (isCoach && !S.compSelMode ? '<button class="btn-del comp-del" data-idx="' + getCompetitions().indexOf(c) + '" style="padding:4px 10px">✕</button>' : '')
        + '</div>'
        + '</div>'
        + (S.compSelMode ? '' : mapSquare)
        + '</div>';

      (typeof compsContainer !== 'undefined' ? compsContainer : d).appendChild(ci);
    });
  }

  // Add competition form (coach only)
  if (isCoach) {
    const st3 = document.createElement('div'); st3.className = 'section-title'; st3.style.marginTop='20px'; st3.textContent = 'Añadir competición';
    d.appendChild(st3);
    const form = document.createElement('div'); form.className = 'card';

    const fields = [
      {label:'Nombre',type:'text',id:'comp-name'},
      {label:'Fecha inicio',type:'date',id:'comp-start'},
      {label:'Fecha fin (opcional)',type:'date',id:'comp-end'},
      {label:'Lugar',type:'text',id:'comp-loc'}
    ];
    fields.forEach(f => {
      const lbl = document.createElement('label'); lbl.className = 'field-label'; lbl.textContent = f.label; form.appendChild(lbl);
      const inp = document.createElement('input'); inp.type = f.type; inp.id = f.id; if (f.type === 'text') inp.maxLength = 120; form.appendChild(inp);
      // Pre-cargar fecha inicio y fin al día 1 del mes actual
      if (f.type === 'date') {
        const now = new Date();
        const firstOfMonth = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-01';
        inp.value = firstOfMonth;
      }
      if (f.id === 'comp-start') {
        inp.addEventListener('change', function() {
          const endEl = document.getElementById('comp-end');
          if (endEl && this.value) endEl.value = this.value;
        });
      }
    });
    const lbl2 = document.createElement('label'); lbl2.className = 'field-label'; lbl2.textContent = 'Tipo'; form.appendChild(lbl2);
    const typeSelect = document.createElement('select'); typeSelect.id = 'comp-type';
    COMP_TYPES.forEach(t => { const o = document.createElement('option'); o.value=t; o.textContent=t; typeSelect.appendChild(o); });
    form.appendChild(typeSelect);

    const addBtn = document.createElement('button'); addBtn.className = 'btn btn-danger'; addBtn.style.marginTop='14px'; addBtn.textContent = 'Añadir competición';
    addBtn.onclick = function() {
      const nameEl = document.getElementById('comp-name');
      const startEl = document.getElementById('comp-start');
      const endEl = document.getElementById('comp-end');
      const locEl = document.getElementById('comp-loc');
      const typeEl = document.getElementById('comp-type');
      const name = (nameEl || {}).value || '';
      const start = (startEl || {}).value || '';
      const end = (endEl || {}).value || '';
      const loc = (locEl || {}).value || '';
      const type = (typeEl || {}).value || 'Regional';
      if (!name.trim() || !start) {
        this.textContent = '⚠ Falta nombre o fecha inicio';
        const btn = this;
        setTimeout(function() { btn.textContent = 'Añadir competición'; }, 2000);
        return;
      }
      // Límite de pruebas por nadador según ámbito (ajustable luego por competición)
      const maxByType = { 'Regional': 4, 'Autonómico': 8, 'Nacional': 8, 'Internacional': 8, 'Otros': 4 };
      const maxEv = maxByType[type] || 4;
      const btn2 = this; btn2.disabled = true; btn2.textContent = 'Guardando…';
      dbAddCompetition({ name: name.trim(), start: start, end: end || start, location: loc.trim(), type: type, maxEvents: maxEv }).then(function() {
        // limpiar campos sin rerender completo
        if (nameEl) nameEl.value = '';
        if (startEl) startEl.value = '';
        if (endEl) endEl.value = '';
        if (locEl) locEl.value = '';
        btn2.disabled = false; btn2.textContent = 'Añadir competición';
        renderAsync();
      });
    };
    form.appendChild(addBtn);
    d.appendChild(form);
  }
  return d;
}

// ============================================================
// COACH: EQUIPO
// ============================================================
function buildTeamCoachesTab() {
  const d = document.createElement('div');

  const codeCard = document.createElement('div'); codeCard.className = 'card'; codeCard.style.marginBottom = '12px';
  const codeLbl = document.createElement('label'); codeLbl.className = 'field-label'; codeLbl.textContent = 'Código de equipo';
  codeCard.appendChild(codeLbl);
  const codeP = document.createElement('p');
  codeP.style.cssText = 'font-size:0.8rem;color:var(--text2);margin:0 0 10px;';

// AYUDA (manual del entrenador): el texto vive en Supabase (help_articles) y se
// edita en ayuda/entrenador.md + ayuda/sync.py, sin publicar la app.

function helpMdInline(t) {
  return escapeHtml(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
}
function helpMdToHtml(md) {
  const lines = String(md || '').split('\n');
  let html = '', i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    let m;
    if ((m = l.match(/^###\s+(.*)$/))) { html += '<h4>' + helpMdInline(m[1]) + '</h4>'; i++; continue; }
    if (/^\|/.test(l)) {
      const rows = []; while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = function (r) { return r.replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); }); };
      html += '<div class="help-table"><table><thead><tr>' + cells(rows[0]).map(function (c) { return '<th>' + helpMdInline(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
      rows.slice(2).forEach(function (r) { html += '<tr>' + cells(r).map(function (c) { return '<td>' + helpMdInline(c) + '</td>'; }).join('') + '</tr>'; });
      html += '</tbody></table></div>'; continue;
    }
    if (/^(- |\d+\. )/.test(l)) {
      const ordered = /^\d+\. /.test(l); const items = [];
      while (i < lines.length && (ordered ? /^\d+\. /.test(lines[i]) : /^- /.test(lines[i]))) { items.push(lines[i].replace(/^(- |\d+\. )/, '')); i++; }
      html += (ordered ? '<ol>' : '<ul>') + items.map(function (x) { return '<li>' + helpMdInline(x) + '</li>'; }).join('') + (ordered ? '</ol>' : '</ul>'); continue;
    }
    const para = []; while (i < lines.length && lines[i].trim() && !/^(###|\||- |\d+\. )/.test(lines[i])) { para.push(lines[i]); i++; }
    html += '<p>' + helpMdInline(para.join(' ')) + '</p>';
  }
  return html;
}
function helpNorm(t) { return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }

  const d = document.createElement('div');

  q.oninput = function (e) { S.helpQuery = e.target.value; draw(); };

  mail.textContent = 'Escribir a soporte';

}

    closeBtn.textContent = saved ? '✓ Lista cerrada — guardar cambios' : 'Cerrar sesión y guardar';
    const grad = saved ? 'linear-gradient(135deg,#1e8449,#27ae60)' : 'linear-gradient(135deg,#2980b9,#3498db)';
    closeBtn.style.cssText = 'margin-top:10px;width:100%;padding:10px;border-radius:10px;border:none;background:' + grad + ';color:#fff;font-weight:700;font-size:0.85rem;cursor:pointer';
    closeBtn.onclick = function() {
      closeBtn.disabled = true; closeBtn.textContent = 'Guardando…';
      const finalMap = {};
      roster.forEach(function(a) { finalMap[a.id] = S.attDraft[slot][a.id] || 'present'; });
      // Reconfirmamos el id de sesión justo antes de guardar (bypaseando la
      // caché) en vez de confiar en el `sessionId` capturado al abrir esta
      // pantalla: si la sesión se editó/borró y se volvió a publicar desde
      // otra pestaña o dispositivo mientras esta vista seguía abierta, ese
      // id capturado puede ya no existir y Supabase rechaza el insert por
      // la foreign key attendance_session_id_fkey con un 400 poco claro.
      delete _sessionCache[S.attSelDate];
      dbGetSession(S.attSelDate).then(function(freshSess) {
        const freshId = freshSess && freshSess[slot] && freshSess[slot]._id;
        if (!freshId) {
          alert('Esta sesión ya no existe (fue editada o borrada desde otra pantalla). Recargá la pestaña de Asistencia e intentá de nuevo.');
          closeBtn.disabled = false; closeBtn.textContent = 'Cerrar sesión y guardar';
          return;
        }
        return dbSaveAttendanceBulk(freshId, finalMap).then(function(res) {
          if (!res) { alert('Error al guardar. Reintentá.'); closeBtn.disabled = false; closeBtn.textContent = 'Cerrar sesión y guardar'; return; }
          S.attDraft[slot] = finalMap;
          S._attSaved = S._attSaved || {}; S._attSaved[slot] = true;
          render();
        });
      });
    };
    panel.appendChild(closeBtn);
    d.appendChild(panel);
  });

  return d;
}

function athleteHasPendingToday(name) {
  const today = todayStr();
  const w = todayWellness(name);
  if (!w) return true;
  const rpeEntry = normRPE(getDayRPE(today)[name]);
  const slots = daySlots(getSession(today));
  return slots.some(function(s){ return !(rpeEntry && rpeEntry[s.slot]); });
}
function buildHoyStrip() {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;gap:7px;margin-bottom:16px';

  const w = todayWellness(S.athleteName);

  const slots = daySlots(getSession(today));
  const items = [{ lb:'Check-in', done: !!w, rpe:false }];
  if (slots.length === 1) {

// ── Horas de sueño (opcional en el check-in) y RPE frente al objetivo ──────────
// Tramos: 1 <6 h · 2 6–7 · 3 7–8 · 4 8–9 · 5 9+
const SLEEP_BANDS = [{ v:1, lbl:'<6' }, { v:2, lbl:'6–7' }, { v:3, lbl:'7–8' }, { v:4, lbl:'8–9' }, { v:5, lbl:'9+' }];
function sleepTargetBand(name) {
  // Mínimo recomendado por edad: 9 h hasta 12 años y 8 h de 13 a 17 (AASM, Paruthi 2016);
  // 7 h desde los 18 (AASM/SRS, Watson 2015). Sin fecha de nacimiento: 8 h (la mayoría son menores).
  const age = athleteAge(DATA.myBirth && DATA.myBirth[name]);
  if (age != null && age < 13) return { band: 5, h: 9 };
  if (age != null && age >= 18) return { band: 3, h: 7 };
  return { band: 4, h: 8 };
}
function sleepWeekHtml(name) {
  const hist = DATA.athleteWellHist[name] || [];
  const from = dateOffsetA(todayStr(), -6);
  const rows = hist.filter(function (h) { return h.date >= from && h.sleep_band != null; });
  let txt;
  if (rows.length < 3) {
    txt = 'Marca tus horas de sueño unos días para ver tu resumen semanal.';
  } else {
    const t = sleepTargetBand(name);
    const ok = rows.filter(function (h) { return h.sleep_band >= t.band; }).length;
    txt = 'Sueño esta semana: <strong>' + ok + ' de ' + rows.length + '</strong> noches con ' + t.h + ' h o más';
  }
  return '<div style="font-size:0.66rem;color:#5a7a9a;margin-top:3px;line-height:1.35">' + txt + '</div>';
}

function rpeCoverageHtml(hist) {
  // RPE registrado en N de las últimas M sesiones planificadas (14 días; las de hoy sin registrar no cuentan)
  const t = todayStr();
  const have = {};
  (hist || []).forEach(function (h) { have[h.date + '|' + h.slot] = 1; });
  let total = 0, logged = 0;
  for (let i = 13; i >= 0; i--) {
    const ds = dateOffsetA(t, -i);
    daySlots(DATA.sessions && DATA.sessions[ds]).forEach(function (sl) {
      const ok = !!have[ds + '|' + sl.slot];
      if (ds === t && !ok) return;
      total++; if (ok) logged++;
    });
  }
  if (total < 4 || logged / total < 0.8) return '';   // con cobertura baja no sale nada: ni elogio ni reproche
  return 'RPE registrado en <strong>' + logged + ' de tus últimas ' + total + ' sesiones</strong>.';
}
function buildRpeVsTargetA(hist) {

  });
  const last = rows.slice(-10);
  if (last.length < 3) return null;
  const W = 320, mid = 62, k = 12, n = last.length, step = (W - 40) / n, bw = Math.min(22, step - 6);
  let svg = '<line x1="14" y1="' + mid + '" x2="306" y2="' + mid + '" stroke="rgba(100,140,180,0.35)" stroke-width="1"/>';
  let sum = 0;

    sum += r.d;
    const x = 20 + (i + 0.5) * step;
    const dd = Math.max(-4, Math.min(4, r.d));
    const h = Math.abs(dd) * k;
    const y = dd >= 0 ? mid - h : mid;
    const col = r.d > 1 ? '#c0621a' : (r.d < -1 ? '#2980b9' : '#7d93a8');
    const ty = dd >= 0 ? y - 3 : y + h + 10;

  });

// Resumen de una línea de un bloque. Si empieza con series agrupadas ("2x{"), en vez de
// enseñar la llave se muestra la repetición y la primera línea de dentro: "2× (4x400 …)".
function heroBlockSummary(text) {
  const lines = String(text || '').split('\n').map(function(l) { return l.trim(); }).filter(Boolean);
  const reps = [];
  let i = 0;
  for (; i < lines.length; i++) {
    const m = lines[i].match(/^(\d+)\s*[x×]\s*\{$/i);
    if (m) { reps.push(m[1]); continue; }
    if (lines[i] === '{' || lines[i] === '}') continue;
    break;
  }
  const inner = (lines[i] || '').replace(/[{}]/g, '').trim();
  if (!reps.length) return inner;
  return reps.map(function(r) { return r + '×'; }).join(' ') + ' (' + inner + (lines.length > i + 1 ? ' …' : '') + ')';
}

}

function teamMsgWhen(iso) {

  if (hrs < 24 && d.getDate() === now.getDate()) return 'hace ' + hrs + ' h';
  return d.getDate() + ' ' + MONTHS_ES[d.getMonth()].slice(0, 3).toLowerCase() + ' · ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');

// ============================================================
// TU PROGRESO (Inicio del nadador): su propio dato devuelto en gráficos sencillos,
// con un mensaje calculado de SUS números (nada de frases genéricas).
// ============================================================
function apMean(a) { return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : null; }
function apFmt(n, dec) { return String(Math.round(n * Math.pow(10, dec || 0)) / Math.pow(10, dec || 0)).replace('.', ','); }
function apMsg(kind, html) {
  const c = { good: '#1e8449', warn: '#c0392b', info: '#0a84ff', note: '#4a6a8a' }[kind] || '#4a6a8a';
  return '<div class="ap-msg" style="border-left-color:' + c + '">' + html + '</div>';
}
function apWellness(name) {
  const hist = DATA.athleteWellHist[name] || [];
  const t = todayStr();
  const byDate = {}; hist.forEach(function (h) { byDate[h.date] = wellComposite(h); });
  const tw = getDayWellness(t)[name]; if (tw) byDate[t] = wellComposite(tw);
  const prev = Object.keys(byDate).filter(function (d) { return d < dateOffsetA(t, -2) && byDate[d] != null; }).map(function (d) { return byDate[d]; });
  const base = prev.length >= 7 ? apMean(prev) : null;
  const pts = []; for (let i = 13; i >= 0; i--) { const ds = dateOffsetA(t, -i); pts.push({ d: ds, v: byDate[ds] != null ? byDate[ds] : null }); }
  const n = Object.keys(byDate).filter(function (d) { return byDate[d] != null; }).length;
  // gráfico
  // Escala ajustada a sus valores (mín 6 puntos de rango) para que la línea se lea
  const vals = pts.map(function (p) { return p.v; }).filter(function (v) { return v != null; }).concat(base != null ? [base] : []);
  let lo = vals.length ? Math.min.apply(null, vals) - 1 : 4, hi = vals.length ? Math.max.apply(null, vals) + 1 : 20;
  if (hi - lo < 6) { const m = (hi + lo) / 2; lo = m - 3; hi = m + 3; } lo = Math.max(4, lo); hi = Math.min(20, hi);
  const W = 300, H = 80, P = 10, y = function (v) { return P + (H - 2 * P) * (1 - (v - lo) / ((hi - lo) || 1)); }, x = function (i) { return P + i * (W - 2 * P) / 13; };
  let path = '', dots = '';
  pts.forEach(function (p, i) { if (p.v == null) return; path += (path ? ' L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1);
    dots += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="' + (i === 13 ? 4.5 : 3) + '" fill="' + (i === 13 ? wellCompColor(p.v) : '#0a84ff') + '"/>'; });
  const baseLine = base != null ? '<line x1="' + P + '" x2="' + (W - P) + '" y1="' + y(base).toFixed(1) + '" y2="' + y(base).toFixed(1) + '" stroke="rgba(74,106,134,0.55)" stroke-dasharray="4 4"/><text x="' + (W - P) + '" y="' + (y(base) - 4).toFixed(1) + '" text-anchor="end" font-size="9" fill="#4a6a8a">tu media ' + apFmt(base, 1) + '</text>' : '';
  const svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" role="img" aria-label="Tu bienestar de los últimos 14 días">' + baseLine + (path ? '<path d="' + path + '" fill="none" stroke="#0a84ff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' : '') + dots + '</svg>';
  // mensaje
  let msg;
  const last3 = [0, 1, 2].map(function (i) { return byDate[dateOffsetA(t, -i)]; });
  const below = base != null ? last3.filter(function (v) { return v != null && v <= base - 2; }).length : 0;
  const todayV = byDate[t];
  if (!n) msg = apMsg('info', 'Haz tu check-in cada mañana: aquí verás cómo llegas a los entrenos.');
  else if (base == null) msg = apMsg('info', 'Llevas <b>' + n + '</b> check-in' + (n === 1 ? '' : 's') + '. Con <b>7</b>, tu entrenador podrá compararte contigo mismo.');
  else if (below >= 2) msg = apMsg('warn', 'Llevas <b>' + below + ' días</b> por debajo de tu media. Cuéntaselo a tu entrenador: puede ajustar el entreno.');
  else if (todayV != null && todayV >= base + 2) msg = apMsg('good', 'Hoy llegas <b>' + apFmt(todayV - base, 1) + ' puntos por encima</b> de tu media.');
  else if (todayV == null && daySlots(DATA.sessions && DATA.sessions[t]).length) msg = apMsg('note', 'Aún no has hecho el check-in de hoy.');
  else if (todayV == null) { const lastD = Object.keys(byDate).filter(function (d) { return byDate[d] != null; }).sort().pop();
    const lv = byDate[lastD], df = lv - base;
    msg = df <= -2 ? apMsg('warn', 'Tu último check-in (' + formatDateLabel(lastD) + ') fue <b>' + apFmt(-df, 1) + ' puntos por debajo</b> de tu media. Aprovecha el descanso de hoy.')
      : apMsg(df >= 2 ? 'good' : 'note', 'Último check-in (' + formatDateLabel(lastD) + '): <b>' + lv + '/20</b>, tu media es ' + apFmt(base, 1) + '. Hoy descansas.'); }
  else msg = apMsg('note', 'Estás en tu línea: ' + todayV + '/20, tu media es ' + apFmt(base, 1) + '.');
  return '<div class="ap-block"><div class="ap-ttl">Mi bienestar <span>14 días</span></div>' + svg + msg + '</div>';
}
function apLoad(name) {
  const hist = DATA.athleteHist[name] || [];
  const t = todayStr();
  const weeks = [0, 0, 0, 0];   // 0 = esta semana (últimos 7 días)
  hist.forEach(function (h) { const days = Math.round((new Date(t + 'T12:00:00') - new Date(h.date + 'T12:00:00')) / 86400000);
    const w = Math.floor(days / 7); if (w >= 0 && w < 4) weeks[w] += (h.rpe || 0) * (h.duration || 80); });
  const max = Math.max.apply(null, weeks.concat([1]));
  const W = 300, H = 92, bw = 46, gap = (W - 4 * bw) / 5;
  let bars = '';
  [3, 2, 1, 0].forEach(function (w, i) {
    const h = Math.round((H - 26) * weeks[w] / max), xx = gap + i * (bw + gap), yy = H - 16 - h;
    bars += '<rect x="' + xx + '" y="' + yy + '" width="' + bw + '" height="' + Math.max(h, 2) + '" rx="6" fill="' + (w === 0 ? '#0a84ff' : 'rgba(10,132,255,0.32)') + '"/>'
      + '<text x="' + (xx + bw / 2) + '" y="' + (H - 3) + '" text-anchor="middle" font-size="9" fill="#4a6a8a">' + (w === 0 ? 'esta' : '−' + w + ' sem') + '</text>';
  });
  const svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" role="img" aria-label="Tu carga de las últimas 4 semanas">' + bars + '</svg>';
  const prev = weeks.slice(1).filter(function (v) { return v > 0; });
  const avg = apMean(prev);
  let msg;
  if (!weeks[0] && !avg) msg = apMsg('info', 'Pon el RPE después de cada entreno: con él se calcula tu carga.');
  else if (avg == null) msg = apMsg('note', 'Cuando lleves un par de semanas verás si tu carga sube o baja.');
  else {
    const pct = Math.round(100 * (weeks[0] - avg) / avg);
    if (pct >= 15) msg = apMsg('warn', 'Esta semana llevas un <b>' + pct + ' % más</b> de carga que tu media. Cuida el sueño y la comida.');
    else if (pct <= -20) msg = apMsg('good', 'Semana más suave (<b>' + Math.abs(pct) + ' % menos</b>): buen momento para recuperar.');
    else msg = apMsg('note', 'Tu carga está en tu línea (' + (pct >= 0 ? '+' : '−') + Math.abs(pct) + ' % sobre tu media).');
  }
  return '<div class="ap-block"><div class="ap-ttl">Mi carga <span>4 semanas · RPE × minutos</span></div>' + svg + msg + '</div>';
}
function apStrength() {
  const tr = DATA.athStrTrend || {};
  const names = Object.keys(tr).filter(function (k) { return (tr[k] || []).length; });
  if (!names.length) return '<div class="ap-block"><div class="ap-ttl">Mi fuerza</div>' + apMsg('info', 'Los días de físico, apunta peso, repeticiones y RIR en <b>Fuerza</b>: aquí verás subir tu 1RM.') + '</div>';
  let rows = '', best = null;
  names.forEach(function (k) {
    const v = tr[k].map(Number), first = v[0], last = v[v.length - 1], diff = last - first;
    const W = 120, H = 30, mn = Math.min.apply(null, v), mx = Math.max.apply(null, v), sp = (mx - mn) || 1;
    const path = v.map(function (val, i) { return (i ? 'L' : 'M') + (4 + i * (W - 8) / Math.max(v.length - 1, 1)).toFixed(1) + ' ' + (H - 4 - (val - mn) / sp * (H - 8)).toFixed(1); }).join(' ');
    rows += '<div class="ap-str"><div><b>' + escapeHtml(k) + '</b><small>' + Math.round(last) + ' kg' + (v.length > 1 ? ' · ' + (diff >= 0 ? '+' : '−') + apFmt(Math.abs(diff), 1) + ' kg' : '') + '</small></div>'
      + '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" aria-hidden="true"><path d="' + path + '" fill="none" stroke="' + (diff >= 0 ? '#1e8449' : '#d97706') + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';

  const msg = best && best.diff > 0 ? apMsg('good', 'Tu <b>' + escapeHtml(best.k) + '</b> ha subido <b>' + apFmt(best.diff, 1) + ' kg</b> desde que lo registras.')
