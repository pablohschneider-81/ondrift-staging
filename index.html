// ============================================================
// METERS PARSER
// ============================================================
function parseMeters(text) {
  if (!text) return 0;
  // Expand block multipliers: Nx{ ... } before line-by-line parsing
  // Anidables: se resuelve primero el bloque más interno y luego el externo.
  for (let _g = 0; _g < 20; _g++) {
    const prev = text;
    text = text.replace(/(\d+)\s*[xX×]\s*\{([^{}]*)\}/g, (_, mult, inner) => {
      const n = parseInt(mult);
      return inner.trim().split('\n').map(line => {
        const t = line.trim();
        if (!t) return '';
        // If line is NxD, multiply reps by block multiplier
        const m = t.match(/^(\d+)\s*[xX×]\s*(\d+)(.*)/);
        if (m) return (parseInt(m[1]) * n) + 'x' + m[2] + (m[3] || '');
        // If bare distance line
        const b = t.match(/^(\d+)(.*)/);
        if (b) return (parseInt(b[1]) * n) + (b[2] || '');
        return t;
      }).filter(Boolean).join('\n');
    });
    if (text === prev) break;
  }
  let total = 0;
  text.split('\n').forEach(line => {
    const t = line.trim();
    if (!t) return;
    // NxD pattern: 4x50, 6X100, 3×200
    const mult = t.match(/(\d+)\s*[xX×]\s*(\d+)/);
    if (mult) { total += parseInt(mult[1]) * parseInt(mult[2]); return; }
    // Bare distance: line starts with a number (e.g. "300 FC", "200 patada")
    const bare = t.match(/^(\d+)\s+[^x×X]/);
    if (bare) { total += parseInt(bare[1]); }
  });
  return total;
}
function metersLabel(text) {
  const m = parseMeters(text);
  return m > 0 ? m + ' m' : '';
}
function totalMeters(session) {
  if (session.phase === 'Fuerza') return 0;
  var vb = volumeBreakdown(session);
  return vb.hasFondo ? Math.max(vb.grupo, vb.fondo) : vb.grupo;
}
function volumeBreakdown(session) {
  if (session.phase === 'Fuerza') return null;
  var base = parseMeters(session.warmUp) + parseMeters(session.preSet) + parseMeters(session.coolDown);
  var grupo = base + parseMeters(session.mainSet);
  var fondo = base + parseMeters(session.mainSetFondo);
  return { grupo: grupo, fondo: fondo, hasGrupo: parseMeters(session.mainSet) > 0, hasFondo: parseMeters(session.mainSetFondo) > 0 };
}
function buildVolumeBlock(session, prefix) {
  var vb = volumeBreakdown(session);
  if (!vb) return null;
  var wrap = document.createElement('div');
  wrap.style.marginTop = '10px';
  if (!vb.hasGrupo && !vb.hasFondo) {
    // Sin ningún main set cargado todavía: si igual hay metros (calentamiento,
    // pre-set o vuelta a la calma), mostrar un total único en vez de ocultarlo.
    if (vb.grupo <= 0) return null;
    var rowT = document.createElement('div'); rowT.className = 'total-meters';
    rowT.innerHTML = '<span>' + (prefix || '') + 'Volumen</span><span style="font-weight:700;color:var(--accent2)">' + vb.grupo + ' m</span>';
    wrap.appendChild(rowT);
    return wrap;
  }
  if (vb.hasGrupo) {
    var rowG = document.createElement('div'); rowG.className = 'total-meters'; rowG.style.marginBottom = '4px';
    rowG.innerHTML = '<span>' + (prefix || '') + 'Vol. Grupo</span><span style="font-weight:700;color:var(--accent2)">' + vb.grupo + ' m</span>';
    wrap.appendChild(rowG);

  if (vb.hasFondo) {
    var rowF = document.createElement('div'); rowF.className = 'total-meters';
    rowF.innerHTML = '<span>' + (prefix || '') + 'Vol. Fondo</span><span style="font-weight:700;color:var(--gold)">' + vb.fondo + ' m</span>';
    wrap.appendChild(rowF);
  }
  return wrap;
}


// ============================================================
// DOUBLE SESSION HELPERS
// ============================================================
// Storage format v2: tn:session:DATE = { am: sessObj|null, pm: sessObj|null }
// Legacy format: tn:session:DATE = sessObj (treated as single/am)
// Turnos: mañana / tarde / físico (gym NeuroForce, siempre fase Fuerza)
const SLOT_LABEL = { am: 'Mañana', pm: 'Tarde', fis: 'Físico' };
const SLOT_SHORT = { am: 'AM', pm: 'PM', fis: 'FÍS' };
function normDay(raw) {
  if (!raw) return null;
  if (raw.am !== undefined || raw.pm !== undefined || raw.fis !== undefined) return { am: raw.am || null, pm: raw.pm || null, fis: raw.fis || null };
  return { am: raw, pm: null, fis: null }; // legacy single session
}
function daySlots(raw) {
  const n = normDay(raw);
  if (!n) return [];
  const out = [];
  const multi = [n.am, n.pm, n.fis].filter(Boolean).length > 1;
  if (n.am) out.push({ slot: 'am', label: multi ? 'Mañana' : '', sess: n.am });
  if (n.pm) out.push({ slot: 'pm', label: 'Tarde', sess: n.pm });
  if (n.fis) out.push({ slot: 'fis', label: SLOT_LABEL.fis, sess: n.fis });
  return out;
}
function isDoubleDay(raw) {
  const n = normDay(raw);
  return !!(n && n.am && n.pm);
}
// RPE format v2 (double days): entry = { am: {rpe,fatigue,note}, pm: {...} }
// Legacy: entry = { rpe, fatigue, note }
function normRPE(entry) {
  if (!entry) return null;
  if (entry.am !== undefined || entry.pm !== undefined || entry.fis !== undefined) return { am: entry.am || null, pm: entry.pm || null, fis: entry.fis || null };
  return { am: entry, pm: null, fis: null };
}
function rpeSubmissions(entry) {
  const n = normRPE(entry);
  if (!n) return [];
  const out = [];
  if (n.am) out.push({ slot: 'am', data: n.am });
  if (n.pm) out.push({ slot: 'pm', data: n.pm });
  if (n.fis) out.push({ slot: 'fis', data: n.fis });

}

// ============================================================
// RPE COLOR
// ============================================================
// Clasifica el delta RPE reportado − objetivo con margen de tolerancia.
// ±1 es variación normal (no es señal); ±2 vale la pena mirar; ±3+ es discrepancia
// grande en cualquier dirección (mucho más duro o mucho más fácil de lo planeado).
function deltaClass(delta) {
  const abs = Math.abs(delta);
  if (abs <= 1) return 'good';
  if (abs === 2) return 'warn';
  return 'bad';
}
function rpeColor(v) {
  if (!v) return '#555';
  if (v <= 3) return '#1e8449';
  if (v <= 5) return '#5a9e1e';
  if (v <= 6) return '#d4860f';
  if (v <= 8) return '#d2691e';
  return '#c0392b';
}
function contrastText(hex) {
  const c = hex.replace('#','');
  const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return lum > 0.6 ? '#1a2a3a' : '#fff';
}

// ============================================================
// RENDER AT-NOTES
// ============================================================
function renderTextWithNotes(text) {
  if (!text) return '';
  return renderBraceBlocks(text);
}
// Bloques con llaves "N×{ … }", anidables (los mismos que multiplica parseMeters).
// Cada bloque: "N×" y debajo una línea vertical con su contenido. Sin "}" de
// cierre el texto se deja tal cual.
function renderBraceBlocks(s, nivel) {
  nivel = nivel || 0;
  const col = nivel === 0 ? '#0a4fc4' : 'var(--accent2)';
  const re = /(\d+)\s*[xX×]\s*\{/g;
  let html = '', pos = 0, m;
  while ((m = re.exec(s))) {
    let depth = 1, i = re.lastIndex;
    for (; i < s.length && depth > 0; i++) {
      if (s[i] === '{') depth++; else if (s[i] === '}') depth--;
    }
    if (depth !== 0) continue;
    html += renderPlainBlocks(s.slice(pos, m.index).replace(/\s+$/, ''));
    html += '<span style="display:block;color:' + col + ';font-weight:700;letter-spacing:1px;margin-top:2px">' + m[1] + '×</span>'
          + '<span style="display:block;border-left:2px solid ' + col + ';margin-left:6px;padding-left:12px;margin-bottom:2px">'
          + renderBraceBlocks(s.slice(re.lastIndex, i - 1).trim(), nivel + 1) + '</span>';
    pos = i; re.lastIndex = i;
  }
  return html + renderPlainBlocks(s.slice(pos).replace(/^\s+/, ''));
}
function renderPlainBlocks(text) {
  if (!text) return '';
  // Modelo de bloque por indentación (sin llaves):
  //   - Una línea que empieza con "N×" o "Nx" abre un bloque de repetición.
  //   - Las líneas siguientes pertenecen al bloque (se muestran sangradas).
  //   - Una línea EN BLANCO cierra el bloque.
  //   - Texto suelto tras el cierre se muestra normal.
  const rawLines = text.split('\n');
  const out = [];
  let insideBlock = false;
  const openerRe = /^(\d+)\s*[xX\u00d7]\s*$/;        // "2×" o "2x" solos
  const openerInlineRe = /^(\d+)\s*[xX\u00d7]\s+(.+)$/; // "2× algo" (contenido en la misma línea)

  for (let i = 0; i < rawLines.length; i++) {
    const line = rawLines[i];
    const trimmed = line.trim();

    // Línea en blanco: cierra bloque si estaba abierto; separa visualmente
    if (!trimmed) {
      if (insideBlock) insideBlock = false;
      out.push('\n');
      continue;
    }

    // ¿Abre bloque? ("2×" sola, o "2× 4x50 ...")
    const mSolo = trimmed.match(openerRe);
    const mInline = trimmed.match(openerInlineRe);
    if (mSolo || mInline) {
      insideBlock = true;
      const n = (mSolo || mInline)[1];
      out.push(`\n<span style="color:var(--accent2);font-weight:700;letter-spacing:1px">${n}\u00d7</span>`);
      if (mInline && mInline[2].trim()) {
        out.push('\n  ' + renderInlineNotes(mInline[2].trim()));
      }
      continue;
    }

    // Línea normal (dentro o fuera de bloque)
    const indent = insideBlock ? '  ' : '';
    const parts = line.split(/(@[^@\n]+)/g);
    const rendered = parts.map(p => p.startsWith('@') ? `<span class="at-note">${escapeHtml(p)}</span>` : escapeHtml(p)).join('');
    out.push('\n' + indent + rendered.trim());
  }
  return out.join('').replace(/^\n+/, '').replace(/\n{3,}/g, '\n\n');
}
function renderInlineNotes(text) {
  if (!text) return '';
  return text.split(/(@[^@\n]+)/g)
    .map(p => p.startsWith('@') ? `<span class="at-note">${escapeHtml(p)}</span>` : escapeHtml(p)).join('');
}


// ============================================================
// ACWR CALCULATOR
// ============================================================
function calcACWR(athleteName) {
  try {
  const hist = DATA.athleteHist[athleteName] || [];
    if (hist.length < 3) return null;
    const today = new Date();
    // 1) Carga sRPE por entrada (RPE × duración), agrupada por DÍA.
    //    Un día con doble sesión suma am+pm (carga diaria real).
    const loadByDay = {};
    hist.forEach(function(h) {
      const d = dateObj(h.date);
      const daysAgo = Math.floor((today - d) / 86400000);
      if (daysAgo < 0 || daysAgo >= 28) return;
      const srpe = h.rpe * (h.duration || 80);
      loadByDay[h.date] = (loadByDay[h.date] || 0) + srpe;
    });
    // 2) Aguda = suma de carga de los últimos 7 días.
    //    Crónica = media semanal = suma de 28 días / 4.
    let acute = 0, chronic = 0;
    Object.keys(loadByDay).forEach(function(date) {
      const daysAgo = Math.floor((today - dateObj(date)) / 86400000);
      if (daysAgo < 7) acute += loadByDay[date];
      chronic += loadByDay[date];
    });
    const chronicWeekly = chronic / 4;
    if (chronicWeekly === 0) return null;
    // Días distintos con carga en la ventana crónica (28d). El ACWR no es
    // fiable hasta tener ~3 semanas de historia: antes, la ventana crónica
    // está casi vacía y el ratio sale artificialmente alto.
    const diasConCarga = Object.keys(loadByDay).length;
    const ratio = Math.round((acute / chronicWeekly) * 100) / 100;
    if (diasConCarga < 14) return { calibrating: true, days: diasConCarga, value: ratio };
    // 3) Ratio agudo:crónico (umbrales Gabbett 0.8–1.3 válidos con esta fórmula)
    return ratio;
  } catch(e) { return null; }
}
// Detecta si, dentro de la ventana de 28 días que usa el ACWR, hay entradas
// cuya duración cayó en el fallback de 80 min por no encontrar la sesión real
// (sesión borrada / dato huérfano) — no por la carrera de red ya corregida.
function acwrHasEstimated(athleteName) {
  const hist = DATA.athleteHist[athleteName] || [];
  const today = new Date();
  return hist.some(function(h) {
    const daysAgo = Math.floor((today - dateObj(h.date)) / 86400000);
    return daysAgo >= 0 && daysAgo < 28 && h.durationEstimated;
  });
}

// ============================================================
// MONOTONÍA Y STRAIN (Foster, 1998)
// Monotonía = carga media diaria (7d) ÷ desviación estándar de esa carga diaria.
// Captura lo que el ACWR no ve: una semana de RPE parejo día a día puede salir
// "Óptima" en ACWR y aun así ser de riesgo si no hay variación (Foster la
// vinculó a mayor incidencia de enfermedad/lesión incluso con carga moderada).
// Strain = carga semanal total × monotonía.
// Desviación estándar muestral (n-1), consistente con las guías prácticas
// (hojas de cálculo STDEV) más citadas para este método.
function calcMonotonyStrain(athleteName) {
  try {
  const hist = DATA.athleteHist[athleteName] || [];
  const today = new Date();
  const loadByDay = {};
  hist.forEach(function(h) {
    const d = dateObj(h.date);
    const daysAgo = Math.floor((today - d) / 86400000);
    if (daysAgo < 0 || daysAgo >= 7) return;
    const srpe = h.rpe * (h.duration || 80);
    loadByDay[h.date] = (loadByDay[h.date] || 0) + srpe;
  });
  // Construir los 7 días calendario completos: los días sin sesión cuentan
  // como carga 0 (el descanso real es lo que baja la monotonía).
  const dailyLoads = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    dailyLoads.push(loadByDay[key] || 0);
  }
  const weeklyLoad = dailyLoads.reduce(function(a,b){ return a+b; }, 0);
  if (weeklyLoad === 0) return null;
  const n = dailyLoads.length;
  const mean = weeklyLoad / n;
  const variance = dailyLoads.reduce(function(a,b){ return a + Math.pow(b-mean, 2); }, 0) / (n - 1);
  const sd = Math.sqrt(variance);
  if (sd === 0) return { monotony: null, strain: null, weeklyLoad: Math.round(weeklyLoad), flatWeek: true };
  const monotony = Math.round((mean / sd) * 100) / 100;
  const strain = Math.round(weeklyLoad * monotony);
  return { monotony: monotony, strain: strain, weeklyLoad: Math.round(weeklyLoad), flatWeek: false };
  } catch(e) { return null; }
}
function monotonyLabel(m) {
  // Umbrales orientativos de la literatura (Foster/adaptaciones posteriores),
  // no un corte validado específicamente en natación juvenil — usar como guía,
  // no como diagnóstico automático.
  if (m === null) return { label: 'Sin variación', color: '#e74c3c' };
  if (m < 1.5) return { label: 'Bien variada', color: '#27ae60' };
  if (m <= 2.0) return { label: 'Moderada', color: '#f39c12' };
  return { label: 'Alta monotonía', color: '#e74c3c' };
}
function acwrLabel(ratio) {
  if (ratio === null) return null;
  if (typeof ratio === 'object' && ratio.calibrating) return { label: 'Calibrando', color: '#5a7085', icon: '○', calibrating: true };
  if (ratio < 0.8)  return { label: 'Subcarga', color: '#3498db', icon: '↓' };
  if (ratio <= 1.3) return { label: 'Óptimo',   color: '#27ae60', icon: '✓' };
  if (ratio <= 1.5) return { label: 'Atención', color: '#f39c12', icon: '⚠' };
  return              { label: 'Riesgo',    color: '#e74c3c', icon: '⚡' };
}

// TEST DE LACTATO PROGRESIVO — protocolos, motor de cálculo y guardado.
// Umbral: OBLA fijo a 4.0 mmol/L, interpolación lineal entre escalones.
// Zonas Z1-Z4: % de la velocidad umbral (modelo ICAR/Olbrecht, Vorontsov).
// Fuentes: Maglischo "Swimming Fastest" (2003) cap.3; Mujika et al. 2001.
// ============================================================
const LACTATE_PROTOCOLS = {
  '7x200': {
    label: '7×200 (fondo/media distancia)',
    steps: 7, distance: 200,
    help: 'Salida cíclica cada 5:00. Muestra de lactato al final de cada 200.'
  },

  }
};

// Tiempo para una distancia a una velocidad: m:ss (50 m con décimas)
function lacTime(dist, v) {
  if (!v || v <= 0) return '—';
  const t = dist / v, m = Math.floor(t / 60), sec = t - m * 60;
  if (dist <= 50) return t < 60 ? t.toFixed(1) : m + ':' + (sec < 10 ? '0' : '') + sec.toFixed(1);
  const r = Math.round(sec); return (r === 60 ? (m + 1) + ':00' : m + ':' + (r < 10 ? '0' : '') + r);
}
// Zonas por fracción del umbral (las mismas que calcLactateZones) para la tabla por distancias
const LAC_ZONE_FRAC = [
  { zona: 'Z1', sub: 'Recup.', lo: null, hi: 0.80 },
  { zona: 'Z2', sub: 'Aeróbico', lo: 0.80, hi: 1.00 },
  { zona: 'Z3', sub: 'Umbral', lo: 1.00, hi: 1.04 },
  { zona: 'Z4', sub: 'VO2max', lo: 1.04, hi: 1.07 }
];
function buildLactatePaceTable(vT) {
  const dists = [50, 100, 200, 400];
  let h = '<div class="lac-pt-wrap"><table class="lac-pt"><thead><tr><th>Zona</th>' + dists.map(function (d) { return '<th>' + d + ' m</th>'; }).join('') + '</tr></thead><tbody>';
  LAC_ZONE_FRAC.forEach(function (z, zi) {
    h += '<tr><td>' + z.zona + '<small>' + z.sub + '</small></td>' + dists.map(function (d) {
      if (zi === 3 && d === 400) return '<td>—</td>';
      if (z.lo == null) return '<td>&gt; ' + lacTime(d, vT * z.hi) + '</td>';
      return '<td>' + lacTime(d, vT * z.hi) + '–' + lacTime(d, vT * z.lo) + '</td>';
    }).join('') + '</tr>';
  });
  return h + '</tbody></table></div>';
}
function buildLactateSets(vT) {
  const sets = [
    ['Umbral', '16×100 a ' + lacTime(100, vT) + ', 15 s de descanso'],
    ['Umbral', '8×200 a ' + lacTime(200, vT) + ', 20 s de descanso'],
    ['Umbral', '4×400 a ' + lacTime(400, vT * 0.99) + ', 30 s de descanso'],
    ['Base aeróbica', '5×400 a ' + lacTime(400, vT * 0.90) + ', 20 s de descanso'],
    ['Base aeróbica', '3×800 a ' + lacTime(800, vT * 0.88) + ', 30 s de descanso']
  ];
  return '<div class="lac-sets"><div class="lac-sets-t">Series de ejemplo <span>orientativas: ajústalas a tu grupo</span></div>'
    + sets.map(function (x) { return '<div><b>' + x[0] + '</b> · ' + x[1] + '</div>'; }).join('') + '</div>';
}
function lactateCompare(res, histRows) {
  if (!res || !res.threshold || !res.date || !histRows || !histRows.length) return '';
  const prev = histRows.filter(function (r) { return r.protocol === res.protocol && r.date < res.date && r.threshold_speed; })
    .sort(function (a, b) { return a.date < b.date ? 1 : -1; })[0];
  if (!prev) return '';
  const d = 100 / prev.threshold_speed - 100 / res.threshold.v;   // >0 = más rápido
  const txt = Math.abs(d) < 0.3 ? 'Umbral estable respecto al test del ' + formatDateLabel(prev.date) + ' (' + escapeHtml(prev.threshold_pace100) + ').'
    : 'Umbral <b>' + Math.abs(d).toFixed(1).replace('.', ',') + ' s ' + (d > 0 ? 'más rápido' : 'más lento') + '</b> por cada 100 m que en el test del ' + formatDateLabel(prev.date) + ' (' + escapeHtml(prev.threshold_pace100) + ').';
  return '<div class="lac-cmp" style="border-left-color:' + (Math.abs(d) < 0.3 ? '#4a6a8a' : d > 0 ? '#1e8449' : '#d97706') + '">' + txt + '</div>';
}

function paceFromSpeed(v) {
  if (!v || v <= 0) return '--:--';
  const secPer100 = 100 / v;
  const m = Math.floor(secPer100 / 60);
  const s = (secPer100 - m * 60).toFixed(2);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function calcLactateThresholdAt(steps, target) {
  const pts = steps.filter(function(s){ return s.time_s > 0 && s.lactate != null; })
                   .map(function(s) { return { v: s.distance / s.time_s, lac: s.lactate }; });
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i+1];
    if (a.lac <= target && b.lac >= target && b.lac !== a.lac) {
      const frac = (target - a.lac) / (b.lac - a.lac);
      const vT = a.v + frac * (b.v - a.v);
      return { v: vT, pace100: paceFromSpeed(vT) };
    }
  }
  return null;
}

function calcLactateThreshold(steps) { return calcLactateThresholdAt(steps, 4.0); }
function calcAerobicThreshold(steps) { return calcLactateThresholdAt(steps, 2.0); }

function calcPeakVelocity(steps) {
  const valid = steps.filter(function(s){ return s.time_s > 0; });
  if (!valid.length) return null;
  const last = valid[valid.length - 1];
  const v = last.distance / last.time_s;
  return { v: v, pace100: paceFromSpeed(v) };
}

// Zonas contiguas, sin huecos, como % de la velocidad a 4 mmol/L. Orientativas:
// referencias en el manual (Ayuda > Test de lactato). El LT1 a 2 mmol/L fijos no se
// usa como límite: en nadadores entrenados sale al 93–97 % del umbral y vaciaría la Z2.
function calcLactateZones(vThreshold) {
  const z12 = 0.80;
  const ranges = [
    { zona: 'Z1 · Recuperación',   max: z12, objetivo: 'Recuperación activa' },
    { zona: 'Z2 · Base aeróbica',  min: z12, max: 1.00, objetivo: 'Base oxidativa' },
    { zona: 'Z3 · Umbral (EN1)',   min: 1.00, max: 1.04, objetivo: 'Máximo estado estable' },
    { zona: 'Z4 · VO2max (EN2)',   min: 1.04, max: 1.07, objetivo: 'Potencia aeróbica máxima' }
  ];
  return ranges.map(function(r) {
    return {
      zona: r.zona, objetivo: r.objetivo,
      ritmo_rapido: paceFromSpeed(vThreshold * r.max),
      ritmo_lento: r.min ? paceFromSpeed(vThreshold * r.min) : null
    };
  });
}

function e1rmAdj(effLoad, reps, rir) { return effLoad * (1 + (reps + (rir || 0)) / 30); }

// Sugerencia de 72 h para el gimnasio (solo orientativa: no cambia la carga sugerida).
//  · RPE alto: RPE ≥ objetivo + 2 en 2 de los últimos 3 días.
//  · Bienestar bajo: último check-in de las 72 h por debajo de 12 sobre 20 (sueño + músculos + fatiga + estrés).
//  · Cansado: marca Cansado o Agotado 2 de los últimos 3 días.
//  Rojo = RPE alto + (bienestar bajo o cansado) · Amarillo = una de las tres · Verde = nada · Gris = sin datos.
const GYM72_WELL_CUT = 12;
function gymHint72(name) {
  const today = todayStr();
  const days3 = [0, 1, 2].map(function (i) { return dateOffsetA(today, -i); });
  const rpe = (DATA.athleteHist[name] || []).filter(function (h) { return days3.indexOf(h.date) !== -1; });
  const over = {}, tired = {};
  rpe.forEach(function (h) {
    const day = DATA.sessions && DATA.sessions[h.date];
    const sess = day && day[h.slot];
    const target = sess && sess.targetRPE != null ? Number(sess.targetRPE) : null;
    if (target != null && h.rpe != null && h.rpe >= target + 2) over[h.date] = true;
    if (h.fatigue != null && h.fatigue >= 4) tired[h.date] = true;
  });
  const byDate = {};
  ((DATA.teamWellHist && DATA.teamWellHist[name]) || []).forEach(function (w) { byDate[w.date] = w; });
  const tw = getDayWellness(today)[name]; if (tw) byDate[today] = tw;
  let comp = null;
  for (let i = 0; i < days3.length && comp == null; i++) comp = wellComposite(byDate[days3[i]]);
  const nOver = Object.keys(over).length, nTired = Object.keys(tired).length;
  const A = nOver >= 2, B = comp != null && comp < GYM72_WELL_CUT, C = nTired >= 2;
  const why = [];
  if (A) why.push('RPE alto ' + nOver + ' de 3 días');
  if (B) why.push('bienestar ' + comp + '/20');
  if (C) why.push('cansado ' + nTired + ' de 3 días');
  if (!rpe.length && comp == null) return { color: '#9aa7b4', title: 'Sin datos de las últimas 72 h', why: '' };
  if (A && (B || C)) return { color: '#e5484d', title: 'Bajar la carga hoy', why: why.join(' · ') };
  if (A || B || C) return { color: '#f5a524', title: 'Vigilar hoy', why: why.join(' · ') };
  return { color: '#30a46c', title: 'Normal', why: 'RPE en objetivo' + (comp != null ? ' · bienestar ' + comp + '/20' : '') };
}

function buildCoachStrength() {
  const d = document.createElement('div');

  if (DATA.coachStrBw === undefined || DATA.coachStrLatest === undefined) {

    d.innerHTML = '<div class="card"><div class="card-sub" style="text-align:center">Cargando…</div></div>';
    return d;
  }

  // Historial de RPE y check-ins (28 d) para la sugerencia de 72 h; no bloquea la pantalla
  if ((!DATA.allHistLoaded || !DATA.teamWellHist) && !S._gym72Loading && !S._gym72Failed) {
    S._gym72Loading = true;
    Promise.all([
      DATA.teamWellHist ? Promise.resolve() : dbGetTeamWellness(28).then(function (m) { DATA.teamWellHist = m; }),
      DATA.allHistLoaded ? Promise.resolve() : dbGetAllAthleteHist().then(function (map) {
        Object.keys(map).forEach(function (n) { DATA.athleteHist[n] = map[n]; });
        DATA.allHistLoaded = true;
      })
    ]).then(function () { S._gym72Loading = false; render(); })
      .catch(function () { S._gym72Loading = false; S._gym72Failed = true; render(); });
  }

  if (S.coachStrReps === undefined) S.coachStrReps = 6;
  if (S.coachStrRir === undefined) S.coachStrRir = 2;
  S.coachStrBwInput = S.coachStrBwInput || {};

  // Objetivo próxima semana
  const tgt = document.createElement('div'); tgt.className = 'card'; tgt.style.marginBottom = '16px';
  tgt.innerHTML = '<div class="card-title">Objetivo próxima semana</div>'
    + '<div class="card-sub">La carga sugerida se calcula contra esto.</div>';
  const trow = document.createElement('div'); trow.style.cssText = 'display:flex;gap:10px;margin-top:10px';
  [['coachStrReps', 'Reps'], ['coachStrRir', 'RIR']].forEach(function (f) {
    const wrap = document.createElement('div'); wrap.style.flex = '1';
    const lbl = document.createElement('div'); lbl.className = 'field-label'; lbl.textContent = f[1];
    const inp = document.createElement('input'); inp.type = 'number'; inp.inputMode = 'numeric'; inp.value = S[f[0]];
    inp.onchange = function (e) { S[f[0]] = Number(e.target.value); render(); };  // recalcula al salir del campo
    wrap.appendChild(lbl); wrap.appendChild(inp); trow.appendChild(wrap);
  });
  tgt.appendChild(trow);
  d.appendChild(tgt);

  const R = S.coachStrReps, r = S.coachStrRir;

  (DATA.coachStrAthletes || []).forEach(function (a) {
    const bwSaved = DATA.coachStrBw[a.id];
    const bwTyped = S.coachStrBwInput[a.id];
    // Mientras escribís el peso, se usa YA para el cálculo (falta peso / 1RM / sugerido)
    // sin esperar a que toques "kg" — ese botón solo lo deja guardado para la próxima vez.
    const bwHasTyped = bwTyped !== undefined && bwTyped !== '' && !isNaN(Number(bwTyped));
    const bw = bwHasTyped ? Number(bwTyped) : bwSaved;
    const card = document.createElement('div'); card.className = 'card'; card.style.marginBottom = '12px';

    // cabecera + peso corporal
    const head = document.createElement('div'); head.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px';
    const nm = document.createElement('div'); nm.className = 'card-title'; nm.style.cssText = 'margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'; nm.textContent = a.name;
    head.appendChild(nm);
    const bwWrap = document.createElement('div'); bwWrap.style.cssText = 'display:flex;align-items:center;gap:6px';
    // El peso se guarda solo al salir del campo (o con Intro) y queda hasta que se cambie:
    // antes había que tocar "kg" y, si no, se perdía al recargar.
    const bwIn = document.createElement('input'); bwIn.type = 'number'; bwIn.inputMode = 'decimal';
    bwIn.placeholder = 'peso'; bwIn.style.cssText = 'width:70px;text-align:right';
    bwIn.setAttribute('aria-label', 'Peso corporal de ' + a.name + ' en kg');
    bwIn.value = (S.coachStrBwInput[a.id] !== undefined) ? S.coachStrBwInput[a.id] : (bwSaved != null ? bwSaved : '');
    bwIn.oninput = function (e) { S.coachStrBwInput[a.id] = e.target.value; };
    const bwState = document.createElement('span'); bwState.style.cssText = 'font-size:0.75rem;color:var(--text3);min-width:22px';
    bwState.textContent = 'kg';
    let bwSaving = false;
    function saveBw() {
      const raw = S.coachStrBwInput[a.id];
      if (raw === undefined) return;                       // no se tocó
      const v = Number(String(raw).replace(',', '.'));
      if (raw === '' || isNaN(v)) { S.coachStrBwInput[a.id] = undefined; render(); return; }
      if (v < 20 || v > 200) { showToast('El peso debe estar entre 20 y 200 kg', 'error'); return; }
      if (bwSaved != null && Number(bwSaved) === v) { S.coachStrBwInput[a.id] = undefined; render(); return; }
      if (bwSaving) return; bwSaving = true; bwState.textContent = '…';
      dbSaveBodyweight(a.id, Math.round(v * 10) / 10).then(function (res) {
        bwSaving = false;
        if (!res) { bwState.textContent = '⚠'; showToast('No se guardó el peso. Reintenta', 'error'); return; }
        S.coachStrBwInput[a.id] = undefined;
        showToast('✓ Peso de ' + a.name + ' guardado', 'success');
        render();
      });
    }
    bwIn.onblur = saveBw;
    bwIn.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); bwIn.blur(); } };
    bwWrap.appendChild(bwIn); bwWrap.appendChild(bwState); head.appendChild(bwWrap);
    card.appendChild(head);

    // Sugerencia de 72 h: punto de color + título + motivo
    const hint = document.createElement('div');
    hint.style.cssText = 'display:flex;align-items:baseline;gap:8px;margin:-4px 0 10px;font-size:0.8rem;color:var(--text2);min-width:0';
    let h72;
    if (DATA.allHistLoaded && DATA.teamWellHist) h72 = gymHint72(a.name);
    else h72 = { color: '#9aa7b4', title: S._gym72Failed ? 'Sugerencia de 72 h no disponible' : 'Calculando las últimas 72 h…', why: '' };
    const dot = document.createElement('span');
    dot.style.cssText = 'width:10px;height:10px;border-radius:50%;flex-shrink:0;background:' + h72.color;
    dot.setAttribute('aria-hidden', 'true');
    const ht = document.createElement('span'); ht.style.cssText = 'min-width:0;line-height:1.35';
    ht.innerHTML = '<strong style="color:var(--text)">' + escapeHtml(h72.title) + '</strong>' + (h72.why ? ' · ' + escapeHtml(h72.why) : '');
    hint.appendChild(dot); hint.appendChild(ht);
    card.appendChild(hint);

    // tabla de ejercicios
    (DATA.strengthEx || []).forEach(function (ex) {
      const s = DATA.coachStrLatest[a.id + '|' + ex.id];
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid rgba(100,150,190,0.15);font-size:0.82rem';

      let lastTxt = '<span style="color:var(--text3)">sin dato</span>';
      let rmTxt = '—', relTxt = '', sugTxt = '—';

      if (s) {
        lastTxt = s.load_kg + '×' + s.reps + (s.rir != null ? ' · RIR ' + s.rir : '');
        const needsBw = ex.uses_bodyweight;
        if (needsBw && bw == null) {
          rmTxt = '<span style="color:var(--text3)">falta peso</span>';
          sugTxt = '—';
        } else {
          const eff = needsBw ? s.load_kg + bw : s.load_kg;
          const e1 = e1rmAdj(eff, s.reps, s.rir || 0);
          rmTxt = e1.toFixed(0) + ' kg';
          if (bw != null) relTxt = ' · ' + (e1 / bw).toFixed(2) + '×';
          const sugEff = e1 / (1 + (R + r) / 30);
          const sug = needsBw ? sugEff - bw : sugEff;          // pull-up: descuenta el peso corporal
          sugTxt = (sug <= 0 ? 'peso corp. (asistir)' : '<strong style="color:var(--accent2)">' + sug.toFixed(1) + ' kg</strong>');
        }
      }

      row.innerHTML =
        '<div style="flex:1;min-width:0"><div style="font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + ex.name + '</div>'
        + '<div style="font-size:0.72rem;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">últ: ' + lastTxt + '</div></div>'
        + '<div style="text-align:right;min-width:54px;flex-shrink:0"><div style="font-size:0.62rem;letter-spacing:.5px;text-transform:uppercase;color:var(--text3)">1RM' + relTxt + '</div>'
        + '<div style="font-family:monospace;font-weight:700;color:var(--text)">' + rmTxt + '</div></div>'
        + '<div style="text-align:right;min-width:70px;flex-shrink:0"><div style="font-size:0.62rem;letter-spacing:.5px;text-transform:uppercase;color:var(--text3)">sugerido</div>'
        + '<div style="font-family:monospace">' + sugTxt + '</div></div>';
      card.appendChild(row);
    });

    d.appendChild(card);
  });

  return d;
}

async function dbLoadAthleteStrength(name) {
  const id = await dbAthleteId(name);
  if (!id) { DATA.strengthEx = []; DATA.athStrToday = {}; DATA.athStrTrend = {}; return; }
  const today = todayStr();
  const [ex, todayRows, trendRows] = await Promise.all([
    DATA.strengthEx ? Promise.resolve(DATA.strengthEx)
                    : sbFetch('strength_exercises?select=id,name,uses_bodyweight&order=id'),
    sbFetch('strength_sets?athlete_id=eq.' + id + '&date=eq.' + today + '&set_num=eq.1&select=exercise_id,load_kg,reps,rir'),
    sbFetch('v_strength_estimation_athlete?select=exercise,date,rm_est&order=date.asc')
  ]);
  DATA.strengthEx = ex || [];
  const tmap = {}; (todayRows || []).forEach(function (r) { tmap[r.exercise_id] = { load: r.load_kg, reps: r.reps, rir: r.rir }; });
  DATA.athStrToday = tmap;
  const trend = {}; (trendRows || []).forEach(function (r) { (trend[r.exercise] = trend[r.exercise] || []).push(r.rm_est); });
  DATA.athStrTrend = trend;
}

async function dbSaveStrengthSet(name, exerciseId, load, reps, rir, sessionId) {
  const id = await dbAthleteId(name);
  if (!id) return null;
  // Upsert atómico por (athlete_id, exercise_id, date, set_num) — mismo patrón que RPE.
  const res = await sbFetch('strength_sets?on_conflict=athlete_id,exercise_id,date,set_num', {
    method: 'POST',
    prefer: 'resolution=merge-duplicates,return=representation',
    body: JSON.stringify({
      athlete_id: id, exercise_id: exerciseId, date: todayStr(), set_num: 1,
      load_kg: load, reps: reps, rir: rir,
      is_estimation: (Number(rir) === 0),   // solo la serie a RIR 0 alimenta el 1RM
      phase: 'intensification',
      session_id: sessionId || null          // enlaza la serie al entreno de físico del día
    })
  });
  DATA.athStrTrend = undefined;             // fuerza recarga de la tendencia
  return res;
}

// ── Mini-sparkline (SVG) ──────────────────────────────────────────
function strengthSpark(data, w, h) {
  w = w || 110; h = h || 32;
  if (!data || data.length < 2) return '';
  const min = Math.min.apply(null, data), max = Math.max.apply(null, data), rng = (max - min) || 1;
  const pts = data.map(function (v, i) {
    return [(i / (data.length - 1)) * (w - 4) + 2, h - 4 - ((v - min) / rng) * (h - 8)];
  });
  const dPath = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
  const last = pts[pts.length - 1];
  return '<svg width="' + w + '" height="' + h + '" style="display:block">'
    + '<path d="' + dPath + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
    + '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="3" fill="var(--accent)"/></svg>';
}

// Ejercicio del catálogo → campo de texto libre que el coach escribió
// en la sesión de físico para esa categoría biomecánica (Pull/Push/Lower Body).
const STRENGTH_NOTE_FIELD = { 1: 'pullText', 2: 'pushText', 3: 'lowerText' };

function buildAthleteStrength() {
  const d = document.createElement('div');
  const st = document.createElement('div'); st.className = 'section-title'; st.textContent = 'Fuerza';
  d.appendChild(st);

  // Igual que Mi RPE: Fuerza cuelga de la sesión programada para hoy.
  // Solo se habilita si hay un turno con phase === 'Fuerza' (entreno de físico).
  const today = todayStr();
  const rawSession = getSession(today);
  const slots = daySlots(rawSession);
  const fuerzaSlot = slots.find(function (s) { return s.sess && s.sess.phase === 'Fuerza'; });

  if (!fuerzaSlot) {
    const empty = document.createElement('div'); empty.className = 'card';
    empty.innerHTML = '<div class="card-sub" style="text-align:center">Hoy no tienes entreno de físico programado.</div>';
    d.appendChild(empty);
    return d;
  }
  const sessObj = fuerzaSlot.sess;
  const sessionId = sessObj._id || null;

  // Carga perezosa (patrón cache-then-render)
  if (DATA.athStrTrend === undefined) {
    if (!S._strLoading) {
      S._strLoading = true;
      dbLoadAthleteStrength(S.athleteName).then(function () { S._strLoading = false; render(); });
    }
    const loading = document.createElement('div'); loading.className = 'card';
    loading.innerHTML = '<div class="card-sub" style="text-align:center">Cargando…</div>';
    d.appendChild(loading);
    return d;
  }

  S.strInput = S.strInput || {};

  const intro = document.createElement('div'); intro.className = 'card'; intro.style.marginBottom = '16px';
  intro.innerHTML = '<div class="card-title">' + escapeHtml(sessObj.title || 'Físico · hoy') + '</div>'
    + '<div class="card-sub">Registra el peso, las reps y el RIR de tu serie principal. Tu 1RM va subiendo con el tiempo.</div>';
  d.appendChild(intro);

  (DATA.strengthEx || []).forEach(function (ex) {
    const saved = DATA.athStrToday[ex.id];
    if (S.strInput[ex.id] === undefined) {
      S.strInput[ex.id] = saved
        ? { load: saved.load, reps: saved.reps, rir: saved.rir }
        : { load: '', reps: '', rir: '' };
    }
    const inputVal = S.strInput[ex.id];
    const trend = DATA.athStrTrend[ex.name] || [];
    const lastRm = trend.length ? trend[trend.length - 1] : null;
    const noteTxt = sessObj[STRENGTH_NOTE_FIELD[ex.id]];

    const card = document.createElement('div'); card.className = 'card'; card.style.marginBottom = '12px';

    // cabecera: nombre + 1RM estimado
    const head = document.createElement('div');
    head.style.cssText = 'display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px';
    head.innerHTML = '<div class="card-title" style="margin:0">' + ex.name + '</div>'
      + '<div style="text-align:right">'
      + '<div style="font-size:0.62rem;letter-spacing:1px;text-transform:uppercase;color:var(--text3)">1RM est.</div>'
      + '<div style="font-family:monospace;font-weight:700;font-size:1.3rem;color:var(--text)">' + (lastRm != null ? lastRm : '—') + '<span style="font-size:0.7rem;color:var(--text3)"> kg</span></div>'
      + '</div>';
    card.appendChild(head);

    // ejercicios con peso corporal (Pull-up): se registra SOLO el lastre
    if (ex.uses_bodyweight) {
      const bwHint = document.createElement('div');
      bwHint.style.cssText = 'font-size:0.78rem;color:var(--text2);margin-bottom:12px';
      bwHint.textContent = 'Pon solo el lastre que añades, sin tu peso corporal. Sin lastre: 0.';
      card.appendChild(bwHint);
    }
    // nota del coach para esta categoría (Pull/Push/Lower Body) — si escribió algo
    if (noteTxt) {
      const note = document.createElement('div');
      note.style.cssText = 'font-size:0.78rem;color:var(--text2);background:rgba(41,128,185,0.08);border-radius:8px;padding:8px 10px;margin-bottom:12px;white-space:pre-wrap';
      note.textContent = noteTxt;
      card.appendChild(note);
    }

    // inputs carga / reps / rir
    const row = document.createElement('div'); row.style.cssText = 'display:flex;gap:10px;margin-bottom:10px';
    [['load', ex.uses_bodyweight ? 'Lastre' : 'Carga', 'kg'], ['reps', 'Reps', ''], ['rir', 'RIR', '']].forEach(function (f) {
      const wrap = document.createElement('div'); wrap.style.flex = '1';
      const lbl = document.createElement('div'); lbl.className = 'field-label'; lbl.textContent = f[1] + (f[2] ? ' (' + f[2] + ')' : '');
      const inp = document.createElement('input'); inp.type = 'number';
      inp.inputMode = f[0] === 'load' ? 'decimal' : 'numeric';
      if (f[0] === 'reps') { inp.min = '1'; inp.max = '30'; inp.step = '1'; }
      if (f[0] === 'rir') { inp.min = '0'; inp.max = '10'; inp.step = '1'; }
      inp.value = inputVal[f[0]]; inp.placeholder = '—';
      inp.oninput = function (e) { S.strInput[ex.id][f[0]] = e.target.value; };  // sin render: no pierde foco
      wrap.appendChild(lbl); wrap.appendChild(inp); row.appendChild(wrap);
    });
    card.appendChild(row);

    // por qué una serie guardada puede no contar para el 1RM
    if (saved) {
      let why = '';
      if (saved.rir !== 0) why = 'Esta serie no cuenta para tu 1RM: solo cuentan las series con RIR 0.';
      else if (ex.uses_bodyweight && lastRm == null) why = 'Falta tu peso corporal para calcular el 1RM: pídeselo a tu entrenador.';
      if (why) {
        const whyEl = document.createElement('div');
        whyEl.style.cssText = 'font-size:0.78rem;color:var(--text2);margin-bottom:10px';
        whyEl.textContent = why;
        card.appendChild(whyEl);
      }
    }
    // tendencia
    if (trend.length >= 2) {
      const sp = document.createElement('div'); sp.style.cssText = 'display:flex;justify-content:flex-end;margin-bottom:10px';
      sp.innerHTML = strengthSpark(trend);
      card.appendChild(sp);
    }

    // guardar
    const btn = document.createElement('button'); btn.className = 'btn btn-primary';
    btn.textContent = saved ? 'Actualizar' : 'Guardar';
    btn.onclick = function () {
      const v = S.strInput[ex.id];
      if (v.load === '' || v.reps === '') { alert('Pon al menos carga y reps'); return; }
      // La base de datos solo acepta reps 1-30 y RIR 0-10 enteros: avisar antes de enviar
      // (antes devolvía un error y solo se veía "No se guardó — reintenta").
      const nLoad = Number(String(v.load).replace(',', '.'));
      const nReps = Number(String(v.reps).replace(',', '.'));
      const nRir = v.rir === '' ? null : Number(String(v.rir).replace(',', '.'));
      if (isNaN(nLoad) || nLoad < 0) { alert('La carga tiene que ser un número de kg (0 o más).'); return; }
      if (!Number.isInteger(nReps) || nReps < 1 || nReps > 30) {
        alert('Las repeticiones van de 1 a 30, sin decimales.' + (!Number.isInteger(nReps) ? ' ¿Has puesto la carga en la casilla de reps?' : ''));
        return;
      }
      if (nRir !== null && (!Number.isInteger(nRir) || nRir < 0 || nRir > 10)) { alert('El RIR va de 0 a 10, sin decimales.'); return; }
      v.load = nLoad; v.reps = nReps; v.rir = nRir === null ? '' : nRir;
      if (ex.uses_bodyweight && Number(v.load) > 25 && !confirm('Pon solo el lastre que añades, sin tu peso corporal. ¿Seguro que añades ' + v.load + ' kg?')) return;
      btn.disabled = true; btn.textContent = 'Guardando…';
      dbSaveStrengthSet(S.athleteName, ex.id, Number(v.load), Number(v.reps), v.rir === '' ? null : Number(v.rir), sessionId)
        .then(function (res) {
          if (!res) {
            btn.disabled = false; btn.textContent = '⚠ No se guardó — reintenta';
            btn.style.background = '#e74c3c';
            setTimeout(function () { btn.textContent = 'Guardar'; btn.style.background = ''; }, 2800);
            return;
          }
          S.strInput[ex.id] = undefined;   // reseed desde lo guardado
          render();
        });
    };
    card.appendChild(btn);
    d.appendChild(card);
  });

  return d;
}

  app.innerHTML = '';

  const sbBanner = buildSbBanner();
  if (sbBanner) app.appendChild(sbBanner);

  if (S.showResetScreen) { trackScreen('reset_password'); app.appendChild(buildResetPasswordScreen()); return; }
  if (!S.role) { trackScreen('login'); app.appendChild(buildLogin()); return; }
  if (S.role === 'pin') {
    trackScreen('pin');
    app.appendChild(buildPin());
    if (S.showConfirmEmailModal) app.appendChild(buildConfirmEmailModal());
    return;
  }
  if (S.role === 'athlete_pin') { trackScreen('athlete_pin'); app.appendChild(buildAthletePin()); return; }
  if (S.role === 'coach_pending') { trackScreen('coach_pending'); app.appendChild(buildCoachPending()); return; }

  app.appendChild(buildHeader());
  const planBanner = buildPlanBanner();
  if (planBanner) app.appendChild(planBanner);
  const billNotice = buildBillingNotice();
  if (billNotice) app.appendChild(billNotice);
  const nvBanner = buildNewVersionBanner();
  if (nvBanner) app.appendChild(nvBanner);
  if (S.showChangelog) app.appendChild(buildChangelogPanel());
  if (S.role === 'coach' && (S.showProfile || (S.coachProfile && !S.coachProfile.adult_confirmed_at && !S.profileSkipped))) app.appendChild(buildProfileSheet());
  if (S.role === 'coach' && S.showPlans) app.appendChild(buildPlansSheet());
  const content = document.createElement('div');
  content.className = 'content';

  if (S.role === 'coach') {
    // La navegación vive solo en el menú inferior; aquí ya no se pinta la fila de tabs.
    const views = [buildCoachSession, buildCoachRPE, buildCoachSquad, buildCalendar, buildCoachInscripcions, buildCoachTeam, buildCoachHistorial, buildCoachAttendance, buildCoachHelp];
    const view = views[S.tab];
    trackScreen(view.name);
    if (S.tab === 1 || S.tab === 2) {
      // RPE y Escuadra comparten la pestaña "Carga": selector arriba, título propio fuera
      S.lastCargaTab = S.tab;
      const t = document.createElement('div'); t.className = 'section-title'; t.textContent = 'Carga';
      const seg = document.createElement('div'); seg.className = 'seg-a'; seg.setAttribute('role', 'tablist');
      [[1, 'RPE'], [2, 'Escuadra']].forEach(function(o) {
        const b = document.createElement('button');
        b.className = S.tab === o[0] ? 'on' : ''; b.textContent = o[1];
        b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', S.tab === o[0] ? 'true' : 'false');
        b.onclick = function() { S.tab = o[0]; render(); };
        seg.appendChild(b);
      });
      content.append(t, seg);
      const v = view();
      const firstTitle = v.querySelector('.section-title');
      if (firstTitle && /^(RPE|Escuadra)$/.test(firstTitle.textContent.trim())) firstTitle.remove();
      content.appendChild(v);
    } else {
      content.appendChild(view());
    }
  } else {
    const views = [buildAthleteInicio, buildAthleteRPE, buildAthleteStrength, buildCalendar, buildAthleteInscripcions, buildAthleteSession];
    const view = views[S.ath_tab];
    trackScreen(view.name);
    content.appendChild(view());
  }

  app.appendChild(content);
  app.appendChild(buildBottomNav());

  if (S.commentAthlete !== null) app.appendChild(buildCommentSheet());
  if (S.viewResultsCompId) app.appendChild(buildResultsSheet());
}

// Selector Atleta | Entrenador del login en hoja inferior
function buildRoleSegA(active) {
  const seg = document.createElement('div'); seg.className = 'seg-a'; seg.setAttribute('role', 'tablist');
  [['athlete', 'Atleta'], ['coach', 'Entrenador']].forEach(function(o) {
    const b = document.createElement('button'); b.type = 'button';
    b.className = active === o[0] ? 'on' : ''; b.textContent = o[1];
    b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', active === o[0] ? 'true' : 'false');
    b.onclick = function() {
      if (active === o[0]) return;
      if (o[0] === 'coach') { S.role = 'pin'; S.pinBuffer = ''; S.pinError = false; }
      else { S.role = null; S.pinError = false; S.pinMode = 'login'; S.signupError = null; }
      render();
    };
    seg.appendChild(b);
  });
  return seg;
}

  });

  // Logo — imagen estática (fondo ya removido), tal cual, sin animar

  d.appendChild(logo);

  const card = document.createElement('div');
  card.className = 'login-card';

  // Paso 1: sin código de equipo no se muestran nombres.
  if (!getTeamCode()) {
    const h2c = document.createElement('h2');
    h2c.textContent = 'Bienvenido';
    card.appendChild(h2c);

    const pc = document.createElement('p');
    pc.className = 'login-sub';
    pc.textContent = 'Pídele el código de equipo a tu entrenador. Solo hace falta la primera vez.';
    card.appendChild(pc);
    card.appendChild(buildRoleSegA('athlete'));

    const inpCode = document.createElement('input');
    inpCode.type = 'text'; inpCode.placeholder = 'Código de equipo';
    inpCode.className = 'select-styled';
    inpCode.autocapitalize = 'characters'; inpCode.autocorrect = 'off'; inpCode.spellcheck = false;
    inpCode.maxLength = 6;
    inpCode.style.cssText = 'text-transform:uppercase;letter-spacing:2px;text-align:center;font-weight:700;';
    card.appendChild(inpCode);

    if (S.teamCodeError) {
      const e = document.createElement('div');
      e.className = 'pin-error'; e.textContent = S.teamCodeError; e.style.marginTop = '10px';
      card.appendChild(e);
    }

    const goCode = document.createElement('button');
    goCode.className = 'btn btn-primary'; goCode.textContent = 'Continuar'; goCode.style.marginTop = '14px';
    const trySubmit = async () => {
      const v = (inpCode.value || '').trim().toUpperCase();
      if (v.length < 4) { S.teamCodeError = 'Escribe el código completo.'; render(); return; }
      goCode.disabled = true; goCode.textContent = 'Comprobando…';
      setTeamCode(v);
      S.teamCodeError = null;
      const list = await dbGetAthletes();
      if (!list.length) {
        setTeamCode(null);
        if (!S.teamCodeError) S.teamCodeError = 'Código no válido o equipo sin nadadores.';
        render(); return;
      }
      DATA.athletes = list; S.teamCodeError = null; render();
    };
    goCode.onclick = trySubmit;
    inpCode.onkeydown = (e) => { if (e.key === 'Enter') trySubmit(); };
    card.appendChild(goCode);


    d.appendChild(card);
    return d;
  }

  const h2 = document.createElement('h2');
  h2.textContent = 'Selecciona tu nombre';
  card.appendChild(h2);
  const sub2 = document.createElement('p'); sub2.className = 'login-sub';
  sub2.textContent = 'Elige tu nombre y después escribe tu PIN.';
  card.appendChild(sub2);
  card.appendChild(buildRoleSegA('athlete'));

  const sel = document.createElement('select');
  sel.className = 'select-styled';
  const opt0 = document.createElement('option');
  opt0.value = ''; opt0.textContent = '— Seleccionar atleta —';
  sel.appendChild(opt0);
  getAthletes().forEach(name => {
    const o = document.createElement('option');
    o.value = name; o.textContent = name; sel.appendChild(o);
  });
  if (S.rememberedAthlete && getAthletes().indexOf(S.rememberedAthlete.name) !== -1) sel.value = S.rememberedAthlete.name;
  card.appendChild(sel);

  const btnAth = document.createElement('button');
  btnAth.className = 'btn btn-primary'; btnAth.textContent = 'Entrar como Atleta';
  btnAth.style.marginTop = '14px';
  btnAth.onclick = () => {
    if (!sel.value) return;
    const athlete = DATA.athletes.find(a => a.name === sel.value);
    if (!athlete) return;
    S.pendingAthleteId = athlete.id;
    S.pendingAthleteName = sel.value;
    S.athletePinBuffer = '';
    S.athletePinError = '';
    S.role = 'athlete_pin';
    render();
  };
  card.appendChild(btnAth);


  const chg = document.createElement('button');
  chg.textContent = 'Cambiar de equipo';
  chg.style.cssText = 'display:block;margin:12px auto 0;background:none;border:none;color:var(--text2);font-size:0.75rem;text-decoration:underline;cursor:pointer;';
  chg.onclick = () => { setTeamCode(null); DATA.athletes = []; S.teamCodeError = null; render(); };
  card.appendChild(chg);

  d.appendChild(card);
  return d;
}

function buildCoachPending() {
  const d = document.createElement('div');
  d.className = 'login-screen';
  const card = document.createElement('div');
  card.className = 'login-card';

  const h2 = document.createElement('h2');
  const rejected = S.coachStatus === 'rejected';
  h2.textContent = rejected ? 'Solicitud no aprobada' : 'Cuenta en revisi\u00f3n';
  card.appendChild(h2);

  const p = document.createElement('p');
  p.style.cssText = 'text-align:center; color:var(--text-secondary); margin-top:8px; line-height:1.5;';
  p.textContent = rejected
    ? 'Tu solicitud de acceso como entrenador no fue aceptada. Si crees que es un error, contacta al administrador.'
    : 'Tu cuenta fue creada correctamente. Un administrador debe aprobarla antes de que puedas entrar. Vuelve a intentarlo m\u00e1s tarde.';
  card.appendChild(p);

  const payPlan = rejected ? null : PAY_PLANS.find(function(x) { return x.id === getPendingPlan(); });

    h2.textContent = 'Paga tu plan ' + payPlan.name;
    p.textContent = 'Tu cuenta est\u00e1 creada. El plan ' + payPlan.name + ' (' + payPlan.who + ') no tiene prueba gratis: al pagar, la cuenta queda activa al momento y podr\u00e1s invitar a tus compa\u00f1eros.';
    if (!S.planInterval) S.planInterval = 'month';
    const seg = document.createElement('div');
    seg.style.cssText = 'display:flex;gap:6px;margin:16px 0 0';
    [['month', 'Mensual'], ['year', 'Anual \u00b7 2 meses gratis']].forEach(function(o) {
      const b = document.createElement('button');
      b.className = 'btn ' + (S.planInterval === o[0] ? 'btn-primary' : 'btn-secondary') + ' btn-sm';
      b.style.cssText = 'flex:1;width:auto';
      b.textContent = o[1];
      b.onclick = function() { S.planInterval = o[0]; render(); };
      seg.appendChild(b);
    });
    card.appendChild(seg);
    const yearly = S.planInterval === 'year';
    const payBtn = document.createElement('button');
    payBtn.className = 'btn btn-primary';
    payBtn.style.marginTop = '12px';
    payBtn.textContent = 'Pagar ahora el ' + payPlan.name + ' \u00b7 ' + (yearly ? payPlan.year + ' \u20ac/a\u00f1o' : payPlan.month + ' \u20ac/mes');
    const payErr = document.createElement('div');
    payErr.style.cssText = 'color:var(--red);font-size:0.8rem;min-height:1em;margin-top:8px;text-align:center';
    payBtn.onclick = function() { startCheckout(payPlan.id, S.planInterval, payBtn, payErr); };
    const note = document.createElement('div');

    note.textContent = 'IVA incluido. El pago lo procesa Stripe; Ondrift no ve ni guarda tu tarjeta.';
    card.append(payBtn, payErr, note);
  }

  const btn = document.createElement('button');
  btn.className = 'btn btn-secondary';
  btn.style.marginTop = '16px';
  btn.textContent = 'Salir';
  btn.onclick = () => { resetSession(); render(); };
  card.appendChild(btn);

  d.appendChild(card);
  return d;
}

    pl.textContent = 'Has elegido el plan ' + pp.name + ' (' + pp.month + ' €/mes). ' + (isSignup ? 'Crea tu cuenta, confirma el email y entra' : 'Entra con tu cuenta') + ': después pagas y la cuenta queda activa al momento.';
    card.appendChild(pl);
  }
  if (getPendingInvite()) {
    const inv = document.createElement('div');
    inv.style.cssText = 'margin-top:12px;font-size:0.82rem;line-height:1.45;color:var(--text2);text-align:center';
    inv.textContent = 'Te han invitado al plan de otro entrenador. ' + (isSignup ? 'Crea tu cuenta' : 'Entra con tu cuenta') + ' y te unirás automáticamente.';
    card.appendChild(inv);
  }
  // Tras login/registro OK: mira tu estado real y decide a donde vas
  const routeAfterAuth = async () => {
    // Invitado a un Dúo / Grupo: se une antes de mirar el estado, porque unirse
    // aprueba la cuenta y así no se queda esperando la aprobación manual.
    await tryJoinInvite();
    const status = await fetchCoachStatus();
    S.coachEmail = null;
    if (status === 'approved') { clearPendingPlan(); S.role = 'coach'; S.tab = 0; fetchPendingCoachCount(); renderAsync(); maybeShowCoachSurvey(); }
    else if (status === null) {
      // No se pudo leer el estado (red caída o timeout): devolvemos el botón
      // en vez de dejarlo colgado en "Entrando…".
      LAST_AUTH_ERROR = 'offline';
      S.pinError = true;
      submit.disabled = false; submit.textContent = 'Entrar';
      render();
    }
    else { S.role = 'coach_pending'; S.coachStatus = status; render(); }
  };

  const submit = document.createElement('button');
  submit.className = 'btn btn-primary';
  submit.style.marginTop = '14px';

  if (isSignup) {
    submit.textContent = 'Crear cuenta';
    const doSignup = async () => {
      S.signupError = null;
      const em = (email.value || '').trim();
      if (!em || pass.value.length < 8) { S.signupError = 'Email v\u00e1lido y contrase\u00f1a de m\u00ednimo 8 caracteres.'; render(); return; }
      if (pass.value !== pass2.value) { S.signupError = 'Las contrase\u00f1as no coinciden.'; render(); return; }
      submit.disabled = true; submit.textContent = 'Creando\u2026';
      try {
        const res = await fetch(SUPABASE_URL + '/auth/v1/signup', {
          method: 'POST',
          headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: em, password: pass.value })
        });
        const data = await res.json();
        if (!res.ok) {
          S.signupError = (data && data.msg) ? data.msg : 'No se pudo crear la cuenta.';
          submit.disabled = false; submit.textContent = 'Crear cuenta'; render(); return;
        }
        if (data.access_token) {
          // auto-confirmado: entra ya y va directo a "en revisión"
          SB_ACCESS_TOKEN = data.access_token;
          COACH_CREDS = { email: em, password: pass.value };
          await routeAfterAuth();
        } else {
          // requiere confirmar email antes de poder entrar
          S.pinMode = 'login'; S.coachEmail = em;
          submit.disabled = false; S.showConfirmEmailModal = true; render();
        }
      } catch (e) {
        S.signupError = 'Sin conexi\u00f3n.'; submit.disabled = false; submit.textContent = 'Crear cuenta'; render();
      }
    };
    submit.onclick = doSignup;
  } else {
    submit.textContent = 'Entrar';
    const doLogin = async () => {
      submit.disabled = true; submit.textContent = 'Entrando\u2026';
      const ok = await coachSignIn((email.value || '').trim(), pass.value);
      if (ok) { S.pinError = false; await routeAfterAuth(); }
      else { S.pinError = true; submit.disabled = false; submit.textContent = 'Entrar'; render(); }
    };
    submit.onclick = doLogin;
    pass.onkeydown = (e) => { if (e.key === 'Enter') doLogin(); };
  }
  card.appendChild(submit);

  if (!isSignup) {
    const forgot = document.createElement('button');
    forgot.className = 'btn-link';
    forgot.style.cssText = 'display:block;margin:10px auto 0;background:none;border:none;color:var(--accent2);font-size:0.82rem;text-decoration:underline;cursor:pointer;';
    forgot.textContent = '\u00bfOlvidaste tu contrase\u00f1a?';
    forgot.onclick = () => { S.showForgotPassword = true; S.forgotSent = false; S.forgotError = null; render(); };
    card.appendChild(forgot);
  }

  const toggle = document.createElement('button');
  toggle.className = 'btn btn-secondary';
  toggle.style.marginTop = '10px';
  toggle.textContent = isSignup ? 'Ya tengo cuenta' : '\u00bfEres nuevo? Crear cuenta';
  toggle.onclick = () => { S.pinMode = isSignup ? 'login' : 'signup'; S.pinError = false; S.signupError = null; render(); };
  card.appendChild(toggle);

  d.appendChild(card);
  if (S.showForgotPassword) d.appendChild(buildForgotPasswordModal());
  return d;
}

}

// PIN ATLETA
// ============================================================
function buildAthletePin() {
  const d = document.createElement('div');
  const pin = document.createElement('div');
  pin.className = 'pin-screen';
  const title = document.createElement('h2');
  title.textContent = 'PIN de ' + (S.pendingAthleteName ? S.pendingAthleteName.split(' ')[0] : '');
  title.style.fontSize = '1.2rem';
  pin.appendChild(title);

  const dots = document.createElement('div');
  dots.className = 'pin-dots';
  for (let i = 0; i < 6; i++) {
    const dot = document.createElement('div');
    dot.className = 'pin-dot' + (i < S.athletePinBuffer.length ? ' filled' : '');
    dots.appendChild(dot);
  }
  pin.appendChild(dots);

  if (S.athletePinError) {
    const err = document.createElement('div');
    err.className = 'pin-error'; err.textContent = S.athletePinError;
    pin.appendChild(err);
  }
  if (S.athletePinBusy) {
    const busy = document.createElement('div');
    busy.className = 'pin-error'; busy.style.color = 'var(--text2)'; busy.textContent = 'Verificando…';
    pin.appendChild(busy);
  }

  const grid = document.createElement('div');
  grid.className = 'pin-grid';
  const keys = ['1','2','3','4','5','6','7','8','9','⌫','0','✓'];
  keys.forEach(k => {
    const btn = document.createElement('div');
    btn.className = 'pin-btn'; btn.textContent = k;
    btn.onclick = () => {
      if (S.athletePinBusy) return;
      const trySubmit = () => {
        S.athletePinBusy = true; S.athletePinError = ''; render();
        sbFunctionCall('athlete-login', { athlete_id: S.pendingAthleteId, pin: S.athletePinBuffer }, false)
          .then(r => {
            S.athletePinBusy = false;
            if (r.ok && r.data && r.data.access_token) {
              SB_ACCESS_TOKEN = r.data.access_token;
              localStorage.setItem('ondrift_sb_token', SB_ACCESS_TOKEN);
              // El access_token caduca (~1h). Sin guardar el refresh_token, al
              // caducar TODA consulta del nadador daba 401 -> null: el calendario
              // se quedaba sin competiciones y el check-in matinal se volvía a
              // pedir cada vez porque no podía leer el ya guardado.
              if (r.data.refresh_token) {
                SB_REFRESH_TOKEN = r.data.refresh_token;
                localStorage.setItem('ondrift_sb_refresh', SB_REFRESH_TOKEN);
              }
              S.role = 'athlete';
              S.athleteName = S.pendingAthleteName;
              try { localStorage.setItem('ondrift_athlete', JSON.stringify({ id: S.pendingAthleteId, name: S.pendingAthleteName, team: getTeamCode() })); } catch (e) {}
              S.ath_tab = 0;
              S.athletePinBuffer = '';
              // renderAsync (no render): hay que ejecutar loadData() ahora que
              // ya existe el token del nadador. Con render() a secas la pantalla
              // se pintaba sin datos — sin competiciones en el calendario y sin
              // el check-in ya guardado, así que lo volvía a pedir cada vez.
              renderAsync();
            } else {
              S.athletePinError = (r.data && r.data.error) || (r.status >= 500 ? 'Servicio ocupado. Inténtalo de nuevo en unos segundos.' : 'PIN incorrecto. Inténtalo de nuevo.');
              S.athletePinBuffer = '';
              render();
            }
          })
          .catch(() => {
            S.athletePinBusy = false;
            S.athletePinError = 'Sin conexión. Inténtalo de nuevo.';
            S.athletePinBuffer = '';
            render();
          });
      };
      if (k === '⌫') { S.athletePinBuffer = S.athletePinBuffer.slice(0,-1); S.athletePinError = ''; render(); }
      else if (k === '✓') {
        if (S.athletePinBuffer.length === 6) trySubmit();
      } else if (S.athletePinBuffer.length < 6) {
        S.athletePinBuffer += k;
        if (S.athletePinBuffer.length === 6) trySubmit();
        else render();
      }
    };
    grid.appendChild(btn);
  });
  pin.appendChild(grid);
  d.appendChild(pin);

  const backBtn = document.createElement('button');
  backBtn.className = 'btn-exit';
  backBtn.textContent = '← Volver';
  backBtn.style.cssText = 'margin:20px 16px 0;display:block;';
  backBtn.onclick = () => { S.role = null; S.pendingAthleteId = null; S.pendingAthleteName = null; render(); };
  d.insertBefore(backBtn, pin);
  return d;
}

  cancel.className = 'btn btn-secondary'; cancel.textContent = 'Cancelar'; cancel.style.marginTop = '8px';

  save.onclick = async () => {
    if (p1.value.length < 8) { msg.style.color = '#e74c3c'; msg.textContent = 'M\u00ednimo 8 caracteres.'; return; }
    if (p1.value !== p2.value) { msg.style.color = '#e74c3c'; msg.textContent = 'No coinciden.'; return; }

        body: JSON.stringify({ password: p1.value })
      });

        save.disabled = false; save.textContent = 'Guardar';

      save.disabled = false; save.textContent = 'Guardar';
    }
  };

  ov.appendChild(card);

  setTimeout(() => p1.focus(), 50);
}

async function openCoachAdminModal() {
  if (document.getElementById('admin-modal')) return;
  const ov = document.createElement('div');
  ov.id = 'admin-modal';
  ov.style.cssText = 'position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; padding:24px; background:rgba(20,40,70,0.45); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);';

  const selected = new Set(); // ids marcados para borrar en bloque

  const bulkBar = document.createElement('div');
  bulkBar.style.cssText = 'display:none; align-items:center; justify-content:space-between; gap:8px; background:rgba(192,57,43,0.12); border:1px solid rgba(192,57,43,0.4); border-radius:10px; padding:8px 12px; margin-top:10px;';

  bulkBar.append(bulkCount, bulkDelBtn);
  card.appendChild(bulkBar);

  const list = document.createElement('div');

  close.className = 'btn btn-secondary'; close.textContent = 'Cerrar'; close.style.marginTop = '14px';
  close.onclick = () => ov.remove();
  card.appendChild(close);

  ov.appendChild(card);
  ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
  document.body.appendChild(ov);

  let lastRows = [];

  const updateBulkBar = () => {
    bulkBar.style.display = selected.size > 0 ? 'flex' : 'none';
    bulkCount.textContent = selected.size + ' seleccionado' + (selected.size !== 1 ? 's' : '');
  };

  bulkDelBtn.onclick = () => {

    if (!ids.length) return;
    showConfirm(
      '¿Borrar ' + ids.length + ' entrenador' + (ids.length !== 1 ? 'es' : '') + '?',
      'Se eliminan las cuentas por completo. No se puede deshacer.',
      function() {
        bulkDelBtn.disabled = true; bulkDelBtn.textContent = 'Borrando…';
        Promise.all(ids.map(id => fetch(SUPABASE_URL + '/rest/v1/coaches?id=eq.' + id, {
          method: 'DELETE',
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SB_ACCESS_TOKEN, 'Prefer': 'return=minimal' }
        }))).then(() => {
          selected.clear(); updateBulkBar();
          bulkDelBtn.disabled = false; bulkDelBtn.textContent = 'Borrar seleccionados';
          fetchPendingCoachCount();
          loadList();
        });
      }
    );
  };

  const loadList = async (keepSelection) => {
    if (!keepSelection) list.textContent = 'Cargando\u2026';
    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/list_coaches_for_admin', {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SB_ACCESS_TOKEN, 'Content-Type': 'application/json' },
        body: '{}'
      });
      if (!res.ok) { list.textContent = 'No se pudo cargar la lista.'; return; }
      const rows = await res.json();
      lastRows = rows;
      list.innerHTML = '';
      if (!rows.length) { list.textContent = 'No hay entrenadores registrados.'; return; }
      rows.forEach(c => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px; border-radius:12px; background:rgba(255,255,255,0.5); border:1px solid rgba(255,255,255,0.7);';

        if (!c.is_admin) {
          const chk = document.createElement('input');
          chk.type = 'checkbox';
          chk.style.cssText = 'flex-shrink:0; width:18px; height:18px;';
          chk.checked = selected.has(c.id);
          chk.onchange = () => { if (chk.checked) selected.add(c.id); else selected.delete(c.id); updateBulkBar(); };
          row.appendChild(chk);
        }

        const info = document.createElement('div');

async function coachRpc(name, body, _retry) {
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SB_ACCESS_TOKEN, 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
    if ((res.status === 401 || res.status === 403) && !_retry) {
      if (await coachSignIn()) return coachRpc(name, body, true);
    }
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) {}
    return { ok: res.ok, data: data };
  } catch (e) { return { ok: false, data: null }; }
}

// Si falla (p. ej. la función aún no existe), S.coachProfile se queda en null y la app
// funciona como antes: cabecera "Hola, entrenador" y sin avisos.
async function loadCoachProfile() {
  S.coachProfile = null;
  const r = await coachRpc('my_coach_profile');
  if (S.role !== 'coach') return;
  if (r.ok && r.data && r.data[0]) { S.coachProfile = r.data[0]; render(); }
  loadPlanStatus();
  loadBilling();
}

const INVITE_KEY = 'ondrift_invite';

// prueba gratis; tras registrarse y entrar, la pantalla de cuenta pendiente ofrece pagarlo.
const PLAN_KEY = 'ondrift_plan';
function getPendingPlan() {
  let p = S.pendingPlanMem || null;
  try { p = localStorage.getItem(PLAN_KEY) || p; } catch (e) {}
  return (p === 'duo' || p === 'grupo4') ? p : null;
}
function setPendingPlan(p) {
  S.pendingPlanMem = p;
  try { localStorage.setItem(PLAN_KEY, p); } catch (e) {}

function clearPendingPlan() {
  S.pendingPlanMem = null;

function getPendingInvite() {

function fmtDay(iso) {
  // Con año solo si no es el año en curso: "18 de diciembre" / "18 de noviembre de 2027".
  try {

}

// ── Pago con Stripe ─────────────────────────────────────────
// La app solo abre la página de pago de Stripe; el plan lo activa el webhook
// del servidor cuando Stripe confirma el cobro (nunca el navegador).
function appReturnUrl() { return window.location.origin + window.location.pathname; }

async function startCheckout(plan, interval, btn, errEl) {
  btn.disabled = true; const label = btn.textContent; btn.textContent = 'Abriendo el pago…'; errEl.textContent = '';
  track('checkout_start', { plan: plan, interval: interval });
  try {
    const r = await sbFunctionCall('create-checkout', { plan: plan, interval: interval, return_url: appReturnUrl() }, true);
    if (r.ok && r.data && r.data.url) { window.location.href = r.data.url; return; }
    errEl.textContent = (r.data && r.data.error) || 'No se pudo abrir el pago. Inténtalo de nuevo.';
  } catch (e) {
    errEl.textContent = 'Sin conexión. Inténtalo de nuevo.';
  }
  btn.disabled = false; btn.textContent = label;
}

async function openBillingPortal(btn, errEl) {
  btn.disabled = true; const label = btn.textContent; btn.textContent = 'Abriendo…'; if (errEl) errEl.textContent = '';

  }
  btn.disabled = false; btn.textContent = label;
}

// Vuelta desde Stripe: ?pago=ok | ?pago=cancelado. El webhook puede tardar unos
// segundos en activar el plan, así que se reconsulta el estado varias veces.
function handlePaymentReturn() {
  const m = /[?&]pago=(ok|cancelado)/.exec(window.location.search);
  if (!m) return;
  history.replaceState(null, '', window.location.pathname + window.location.hash);
  clearPendingPlan();
  if (m[1] === 'cancelado') { showToast('Pago cancelado. No se ha cobrado nada.'); return; }
  // La sesión de entrenador no se guarda en el dispositivo: al volver de Stripe hay que entrar otra vez.
  if (!S.role) { S.role = 'pin'; S.pinMode = 'login'; S.pinBuffer = ''; S.pinError = false; S.signupError = null; }
  track('checkout_return_ok', {});
  showToast('Pago recibido. Activando tu plan…', 'success');
  let tries = 0;
  const tick = async function() {
    tries++;
    if (S.role !== 'coach') { if (tries < 10) setTimeout(tick, 3000); return; }
    await loadPlanStatus();
    const ps = S.planStatus;
    if (ps && ps.can_write && ['individual', 'duo', 'grupo4', 'club'].indexOf(ps.plan) !== -1) {
      loadBilling();
      showToast('Plan ' + (PLAN_LABELS[ps.plan] || ps.plan) + ' activo. ¡Gracias!', 'success');
      return;
    }
    if (tries < 10) setTimeout(tick, 3000);
    else showToast('El pago está hecho, pero el plan tarda en activarse. Recarga en un minuto.');
  };
  setTimeout(tick, 1500);
}

    S.showProfile = false;
    await loadCoachProfile();
    // Si la base no devolvió la confirmación, no se vuelve a abrir en esta sesión
    if (S.coachProfile && !S.coachProfile.adult_confirmed_at) S.profileSkipped = true;
    render();
  };
  sheet.appendChild(save);
  if (forced) {
    const later = document.createElement('button'); later.className = 'btn btn-secondary'; later.style.marginTop = '8px';
    later.textContent = 'Ahora no';
    later.onclick = close;
    sheet.appendChild(later);
  }

  const ver = document.createElement('div');
  ver.style.cssText = 'text-align:center;font-size:0.72rem;color:var(--text2);margin-top:12px';
  ver.textContent = 'Ondrift v' + APP_VERSION;
  sheet.appendChild(ver);

  overlay.appendChild(sheet);
  return overlay;
}

      {icon:'inicio',label:'Inicio'},
      {icon:'mirpe',label:'Mi RPE'},
