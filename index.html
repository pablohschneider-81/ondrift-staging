function autoGrow(ta) {
  ta.style.height = 'auto';
  ta.style.height = (ta.scrollHeight + 2) + 'px';
}
function makeGrowTextarea(value, placeholder) {
  const ta = document.createElement('textarea');
  ta.className = 'ta-grow'; ta.maxLength = 4000;
  ta.placeholder = placeholder || '';
  ta.value = value || '';
  // filas iniciales según contenido (inmediato, sin esperar layout)
  const lines = (value || '').split('\n').length;
  ta.rows = Math.max(4, lines + 1);
  return ta;
}
function buildCoachSession() {
  const d = document.createElement('div');
  const st = document.createElement('div');
  st.className = 'section-title'; st.textContent = 'Crear sesión';
  d.appendChild(st);

  // Title
  const l1 = document.createElement('label'); l1.className = 'field-label'; l1.textContent = 'Título';
  d.appendChild(l1);
  const titleIn = document.createElement('input');
  titleIn.type = 'text'; titleIn.maxLength = 100; titleIn.placeholder = 'Ej: Trabajo de velocidad'; titleIn.value = S.sessionTitle;
  titleIn.oninput = e => { S.sessionTitle = e.target.value; };
  d.appendChild(titleIn);

  // RPE objetivo y duración: desplegables, uno al lado del otro
  const pairField = function(labelText, control) {
    const w = document.createElement('div');
    const l = document.createElement('label'); l.className = 'field-label'; l.textContent = labelText;
    w.append(l, control);
    return w;
  };
  const rpeIn = document.createElement('select');
  for (let v = 1; v <= 10; v++) {
    const o = document.createElement('option'); o.value = v; o.textContent = v + ' / 10';
    if (v === S.sessionRPE) o.selected = true;
    rpeIn.appendChild(o);
  }
  rpeIn.onchange = e => { S.sessionRPE = parseInt(e.target.value) || 6; };

  // Duración (min) — para sRPE = RPE × duración. De 5 en 5 entre 30 min y 3 h; se conserva un valor guardado que no esté en la lista.
  const durIn = document.createElement('select');
  const durOpts = [];
  for (let m = 30; m <= 180; m += 5) durOpts.push(m);
  if (durOpts.indexOf(S.sessionDuration) < 0) { durOpts.push(S.sessionDuration); durOpts.sort(function(a, b) { return a - b; }); }
  durOpts.forEach(function(m) {
    const o = document.createElement('option'); o.value = m;
    o.textContent = m + ' min' + (m >= 60 ? ' · ' + Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) : '') : '');
    if (m === S.sessionDuration) o.selected = true;
    durIn.appendChild(o);
  });
  durIn.onchange = e => { S.sessionDuration = parseInt(e.target.value) || 80; };

  const row1 = document.createElement('div'); row1.className = 'form-row-2';
  row1.append(pairField('RPE objetivo', rpeIn), pairField('Duración', durIn));
  d.appendChild(row1);

  // Phase
  const phaseSelect = document.createElement('select');
  // Físico → solo Fuerza (NeuroForce). Mañana/Tarde/Única → nunca Fuerza.
  if (S.sessionSlot === 'fis') S.sessionPhase = 'Fuerza';
  else if (S.sessionPhase === 'Fuerza') S.sessionPhase = 'Ligero';
  const phaseOpts = S.sessionSlot === 'fis' ? ['Fuerza']
    : PHASES.filter(function(p) { return p !== 'Fuerza'; });
  phaseOpts.forEach(p => {
    const o = document.createElement('option'); o.value = p; o.textContent = (S.sessionSlot === 'fis' && p === 'Fuerza') ? 'NeuroForce' : p;
    if (p === S.sessionPhase) o.selected = true;
    phaseSelect.appendChild(o);
  });
  phaseSelect.onchange = e => { S.sessionPhase = e.target.value; S.alphaPhase = null; render(); };

  // Date
  const dateIn = document.createElement('input');
  dateIn.type = 'date'; dateIn.value = S.sessionDate;
  dateIn.oninput = e => { S.sessionDate = e.target.value; };

  const row2 = document.createElement('div'); row2.className = 'form-row-2';
  row2.append(pairField('Fase', phaseSelect), pairField('Fecha', dateIn));
  d.appendChild(row2);

  // Turno selector
  const lturno = document.createElement('label'); lturno.className = 'field-label'; lturno.textContent = 'Turno';
  d.appendChild(lturno);
  const turnoWrap = document.createElement('div'); turnoWrap.className = 'pack-toggle';
  [['unica','Única'],['am','Mañana'],['pm','Tarde'],['fis','Físico']].forEach(function(pair) {
    const btn = document.createElement('button');
    btn.className = 'pack-btn' + (S.sessionSlot === pair[0] ? ' active' : '');
    btn.textContent = pair[1];
    btn.onclick = function() {
      S.sessionSlot = pair[0];
      // Físico = gym NeuroForce: siempre fase Fuerza (muestra Pull/Push/Lower)
      if (pair[0] === 'fis' && S.sessionPhase !== 'Fuerza') { S.sessionPhase = 'Fuerza'; S.alphaPhase = null; render(); return; }
      if (pair[0] !== 'fis' && S.sessionPhase === 'Fuerza') { S.sessionPhase = 'Ligero'; S.alphaPhase = null; render(); return; }
      turnoWrap.querySelectorAll('.pack-btn').forEach(function(b, i) {
        b.classList.toggle('active', ['unica','am','pm','fis'][i] === pair[0]);
      });
    };
    turnoWrap.appendChild(btn);
  });
  d.appendChild(turnoWrap);

  if (S.sessionPhase === 'Fuerza') {
    // AlphaPattern
    const la = document.createElement('label'); la.className = 'field-label'; la.textContent = 'AlphaPattern Fase';
    d.appendChild(la);
    const ag = document.createElement('div'); ag.className = 'alpha-grid';
    ALPHA_PHASES.forEach(ap => {
      const btn = document.createElement('button');
      btn.className = 'alpha-btn' + (S.alphaPhase === ap ? ' selected' : '');
      btn.textContent = ap;
      btn.onclick = () => { S.alphaPhase = ap; render(); };
      ag.appendChild(btn);
    });
    d.appendChild(ag);

    // Pull Push Lower
    ['Pull','Push','Lower Body'].forEach((sec, idx) => {
      const key = ['pullText','pushText','lowerText'][idx];
      const lbl = document.createElement('label'); lbl.className = 'field-label'; lbl.textContent = sec;
      d.appendChild(lbl);
      const ta = makeGrowTextarea(S[key], `Ejercicios ${sec}...`);
      ta.oninput = e => { S[key] = e.target.value; autoGrow(e.target); };
      d.appendChild(ta);
    });
  } else {
    // Normal sections
    const sections = [
      {label:'Warm Up', key:'warmUp'},
      {label:'Pre Set', key:'preSet'},
      {label:'Main Set (Grupo)', key:'mainSet'},
      {label:'Main Set (Fondo)', key:'mainSetFondo'},
      {label:'Cool Down', key:'coolDown'}
    ];
    sections.forEach(sec => {
      const lbl = document.createElement('label'); lbl.className = 'field-label'; lbl.textContent = sec.label;
      d.appendChild(lbl);
      const ta = makeGrowTextarea(S[sec.key], '');
      ta.oninput = e => { S[sec.key] = e.target.value; autoGrow(e.target); updateMeters(d); };
      ta.dataset.key = sec.key;
      d.appendChild(ta);
      const mstat = document.createElement('div'); mstat.className = 'meter-stat'; mstat.dataset.mstat = sec.key;
      const m = metersLabel(S[sec.key]);
      if (m) mstat.textContent = '→ ' + m;
      d.appendChild(mstat);
    });
    // Volume breakdown — el contenedor se crea SIEMPRE (aunque arranque vacío),
    // para que updateMeters() lo pueda ir llenando en vivo sin esperar a un
    // re-render completo de la pantalla (que solo pasa al salir y volver a entrar).
    const volWrap = document.createElement('div'); volWrap.id = 'total-meters-div';
    const volBlock = buildVolumeBlock({ phase: S.sessionPhase, warmUp: S.warmUp, preSet: S.preSet, mainSet: S.mainSet, mainSetFondo: S.mainSetFondo, coolDown: S.coolDown }, '');
    if (volBlock) volWrap.appendChild(volBlock);
    d.appendChild(volWrap);
  }

  // Pack días
  const lpack = document.createElement('label'); lpack.className = 'field-label'; lpack.textContent = 'Paquete de días';
  d.appendChild(lpack);
  const packWrap = document.createElement('div'); packWrap.className = 'pack-toggle';
  [1,2,3,4].forEach(n => {
    const btn = document.createElement('button');
    btn.className = 'pack-btn' + (S.packDays === n ? ' active' : '');
    btn.textContent = n === 1 ? 'Solo hoy' : n + ' días';
    btn.onclick = () => { S.packDays = n; };
    packWrap.appendChild(btn);
    btn.onclick = () => {
      S.packDays = n;
      packWrap.querySelectorAll('.pack-btn').forEach((b,i) => {
        b.classList.toggle('active', i === [1,2,3,4].indexOf(n));
      });
    };
  });
  d.appendChild(packWrap);

  // Actions
  const actions = document.createElement('div'); actions.className = 'actions-row';
  const clearBtn = document.createElement('button');
  clearBtn.className = 'btn btn-secondary'; clearBtn.textContent = 'Limpiar';
  clearBtn.onclick = () => {
    showConfirm('¿Borrar sesión?', 'Se perderán todos los campos cargados en el editor.', () => {
      S.sessionTitle=''; S.sessionRPE=6; S.sessionDuration=80; S.sessionPhase='Ligero'; S.sessionDate=todayStr();
      S.alphaPhase=null; S.pullText=''; S.pushText=''; S.lowerText='';
      S.warmUp=''; S.preSet=''; S.mainSet=''; S.mainSetFondo=''; S.coolDown=''; S.packDays=1; S.editingFrom=null;
      render();
    });
  };
  actions.appendChild(clearBtn);

  const pubBtn = document.createElement('button');
  pubBtn.className = 'btn btn-primary'; pubBtn.textContent = 'Publicar';
  const publishNow = function() {
    // Defensa en profundidad: nunca dejar salir un RPE/duración fuera de rango
    // hacia Supabase (los CHECK constraints de la tabla exigen RPE 1–10 y
    // duración 10–300; si esto falla ahí, llega como 400 sin feedback claro).
    S.sessionRPE = Math.min(10, Math.max(1, S.sessionRPE || 6));
    S.sessionDuration = Math.min(300, Math.max(10, S.sessionDuration || 80));
    const session = {
      title: S.sessionTitle || 'Sin título',
      targetRPE: S.sessionRPE,
      duration: S.sessionDuration,
      phase: S.sessionSlot === 'fis' ? 'Fuerza' : S.sessionPhase,
      alphaPhase: S.alphaPhase,
      pullText: S.pullText,
      pushText: S.pushText,
      lowerText: S.lowerText,
      warmUp: S.warmUp,
      preSet: S.preSet,
      mainSet: S.mainSet,
      mainSetFondo: S.mainSetFondo,
      coolDown: S.coolDown
    };
    const baseDate = S.sessionDate || todayStr();
    const publishPromises = [];
    for (let i = 0; i < S.packDays; i++) {
      const d2 = new Date(baseDate + 'T12:00:00');
      d2.setDate(d2.getDate() + i);
      const ds = d2.getFullYear()+'-'+String(d2.getMonth()+1).padStart(2,'0')+'-'+String(d2.getDate()).padStart(2,'0');
      const slots = S.sessionSlot === 'unica' ? ['am'] : [S.sessionSlot];
      slots.forEach(function(sl) {
        publishPromises.push(dbSaveSession(ds, sl, session));
      });
    }
    const btn = this;
    btn.disabled = true; btn.textContent = 'Publicando…';
    Promise.all(publishPromises).then(function(results) {
      // verificar que TODOS los guardados respondieron ok (no null)
      const allOk = results.every(function(r) { return r !== null && r !== false; });
      if (!allOk) {
        btn.disabled = false; btn.textContent = 'Publicar';
        showToast('⚠ Error — reintenta', 'error');
        return;
      }
      // guardado confirmado → limpiar formulario
      S.sessionTitle=''; S.sessionRPE=6; S.sessionDuration=80; S.sessionPhase='Ligero'; S.sessionDate=todayStr();
      S.alphaPhase=null; S.pullText=''; S.pushText=''; S.lowerText='';
      S.warmUp=''; S.preSet=''; S.mainSet=''; S.mainSetFondo=''; S.coolDown=''; S.packDays=1; S.editingFrom=null;
      const rem = S._pendingSlotRemovals || [];
      S._pendingSlotRemovals = null;
      if (!rem.length) { showToast('✓ Sesión publicada', 'success'); renderAsync(); return; }
      Promise.all(rem.map(function(r) {
        return dbDeleteSession(r.date, r.slot).then(function(rows) { return { r: r, ok: rows !== null }; });
      })).then(function(res) {
        _allSessionsCache = null;
        const kept = res.filter(function(x) { return !x.ok; });
        if (!kept.length) showToast('✓ Publicada como entreno único', 'success');
        else showToast('✓ Publicada. La tarde del ' + kept.map(function(x) { return formatDateLabel(x.r.date); }).join(', ') + ' se mantiene: ya tiene asistencia', 'error');
        renderAsync();
      });
    }).catch(function() {
      btn.disabled = false; btn.textContent = 'Publicar';
      showToast('⚠ Error de conexión', 'error');
    });
  };
  pubBtn.onclick = function() {
    const btn = this;
    if (btn.disabled) return;
    // Sin título ni ningún bloque escrito no hay entreno: publicarlo creaba sesiones
    // "Sin título" vacías que luego salían como una lista de asistencia de más.
    const hasText = function(v) { return String(v || '').trim() !== ''; };
    if (!hasText(S.sessionTitle) && !['warmUp','preSet','mainSet','mainSetFondo','coolDown','pullText','pushText','lowerText'].some(function(k) { return hasText(S[k]); })) {
      showToast('El entreno está vacío: escribe un título o algún bloque', 'error');
      return;
    }
    const targets = sessionPublishTargets();
    btn.disabled = true; btn.textContent = 'Comprobando…';
    sessionPublishConflicts(targets).then(function(conf) {
      btn.disabled = false; btn.textContent = 'Publicar';
      if (conf === null) { showToast('⚠ No se pudo comprobar si ya hay entrenos. Reintenta', 'error'); return; }
      if (!conf.length) { S._pendingSlotRemovals = []; publishNow.call(btn); return; }
      const slotName = { am: 'Mañana', pm: 'Tarde', fis: 'Físico' };
      const list = conf.map(function(r) {
        return '<li><b>' + escapeHtml(formatDateLabel(r.date)) + '</b>' + (slotName[r.slot] ? ' · ' + slotName[r.slot] : '') + ': ' + escapeHtml(r.title || 'Sin título')
          + (r.remove ? ' <i>(se borra: eliges entreno único)</i>' : '') + '</li>';
      }).join('');
      // tardes que hay que quitar después de publicar como "Única"
      S._pendingSlotRemovals = conf.filter(function(r) { return r.remove; }).map(function(r) { return { date: r.date, slot: r.slot }; });
      const ul = '<ul style="margin:6px 0 8px;padding-left:18px;text-align:left">' + list + '</ul>';
      // Solo el entreno abierto con el lápiz: es una edición, aviso suave
      if (conf.length === 1 && conf[0].editing && !conf[0].remove) {
        showConfirm('¿Guardar los cambios?', ul + 'Se actualizará el entreno publicado.',
          function() { publishNow.call(btn); }, { okText: 'Guardar cambios', okSafe: true });
        return;
      }
      showConfirm(conf.length > 1 ? 'Ya hay ' + conf.length + ' entrenos publicados' : 'Ya hay un entreno publicado',
        ul + 'Si publicas, ' + (conf.length > 1 ? 'se reemplazarán' : 'se reemplazará') + ' y no se podrá recuperar.',
        function() { publishNow.call(btn); },
        { okText: 'Reemplazar' });
    });
  };
  actions.appendChild(pubBtn);
  d.appendChild(actions);
  requestAnimationFrame(function(){ d.querySelectorAll('textarea.ta-grow').forEach(autoGrow); });
  return d;
}

function totalMetersFromState() {
  return parseMeters(S.warmUp) + parseMeters(S.preSet) + parseMeters(S.mainSet) + parseMeters(S.mainSetFondo) + parseMeters(S.coolDown);

// ============================================================
// COACH: RPE
// ============================================================
function buildCoachRPE() {
  const d = document.createElement('div');
  const stTop = document.createElement('div'); stTop.className = 'section-title'; stTop.textContent = 'RPE';
  d.appendChild(stTop);
  const today = todayStr();
  const session = getSession(today);
  const dayRPE = getDayRPE(today);
  const athletes = getAthletes();

  // Today session info
  const sc = document.createElement('div'); sc.className = 'card'; sc.style.marginBottom = '12px';
  const todaySlots = daySlots(session);
  if (todaySlots.length > 0) {
    sc.innerHTML = todaySlots.map(function(s) {
      return '<div class="card-title">' + (s.label ? s.label + ' — ' : '') + escapeHtml(s.sess.title) + '</div>'
        + '<div class="card-sub">RPE objetivo: <strong>' + s.sess.targetRPE + '</strong> · Fase: <strong>' + escapeHtml(s.sess.phase) + '</strong></div>';

  } else {
    sc.innerHTML = '<div class="card-sub">Sin sesión publicada para hoy</div>';
  }
  d.appendChild(sc);

  // Summary stats
  const responses = athletes.filter(a => dayRPE[a]);
  if (responses.length > 0) {
    let sum = 0, count = 0;
    responses.forEach(function(a) {
      rpeSubmissions(dayRPE[a]).forEach(function(sub) { sum += sub.data.rpe || 0; count++; });
    });
    const avgRPE = count > 0 ? (sum / count).toFixed(1) : '—';
    const targetLbl = todaySlots.length > 0 ? todaySlots.map(function(s){return s.sess.targetRPE;}).join(' / ') : '—';
    const sr = document.createElement('div'); sr.className = 'summary-row';
    [{val:avgRPE,lbl:'RPE Medio'},{val:targetLbl,lbl:'RPE Objetivo'},{val:responses.length+'/'+athletes.length,lbl:'Respuestas'}].forEach(item => {
      const box = document.createElement('div'); box.className = 'summary-box';
      box.innerHTML = `<div class="summary-val">${item.val}</div><div class="summary-lbl">${item.lbl}</div>`;
      sr.appendChild(box);
    });
    d.appendChild(sr);
  }

  // RPE Table
  const st = document.createElement('div'); st.className = 'section-title'; st.textContent = 'Hoy · ' + athletes.filter(function(a) { return dayRPE[a]; }).length + ' de ' + athletes.length + ' respondieron';
  d.appendChild(st);

  // Lista: RPE, nombre y estado, desvío y un botón ⋯ con las acciones
  const targetLbl = todaySlots.map(function(s) { return s.sess.targetRPE; }).filter(Boolean).join(' / ');
  const MORE_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>';
  const answeredRows = [], pendingRows = [];
  athletes.forEach(function(name) {
    const entry = dayRPE[name];
    const hasComment = !!getComments()[today + '_' + name];
    const moreBtn = '<button class="rpe-more" data-more-ath="' + escapeHtml(name) + '" aria-label="Acciones para ' + escapeHtml(name) + '">' + MORE_SVG + '</button>';
    const cdot = hasComment ? '<span class="rpe-cdot" title="Tiene comentario"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg></span>' : '';
    if (entry) {
      const subs = rpeSubmissions(entry);
      const circles = subs.map(function(sub) {
        return '<span class="rpe-circle" style="background:' + rpeColor(sub.data.rpe) + '" title="' + (SLOT_SHORT[sub.slot] || sub.slot) + '">' + sub.data.rpe + '</span>';
      }).join('');
      const lastSub = subs[subs.length - 1].data;
      const fat = FATIGUE.find(function(f) { return f.v === lastSub.fatigue; }) || FATIGUE[0];
      const slotMap = normDay(session) || {};
      let deltaSum = 0, deltaCount = 0;
      subs.forEach(function(sub) {
        const target = slotMap[sub.slot] ? slotMap[sub.slot].targetRPE : null;
        if (target) { deltaSum += sub.data.rpe - target; deltaCount++; }
      });
      const delta = deltaCount > 0 ? Math.round(deltaSum / deltaCount) : 0;
      const deltaStr = deltaCount > 0 ? (delta > 0 ? '+' + delta : delta < 0 ? '' + delta : '=') : '';
      const dClass = deltaCount > 0 ? deltaClass(delta) : '';
      const note = lastSub.note ? '<small class="rpe-note">“' + escapeHtml(lastSub.note) + '”</small>' : '';

        '<div class="rpe-nm">' + escapeHtml(name) + cdot + '<small><span style="color:' + fat.color + ';font-weight:600">' + fat.label + '</span>' +
        (targetLbl ? ' · objetivo ' + targetLbl : '') + '</small>' + note + '</div>' +
        '<span class="delta ' + dClass + '">' + deltaStr + '</span>' + moreBtn + '</div>');
    } else {
      pendingRows.push('<div class="rpe-row"><div class="rpe-circles"><span class="rpe-circle rpe-empty">–</span></div>' +

    const plist = document.createElement('div'); plist.className = 'card rpe-list'; plist.innerHTML = pendingRows.join('');
    d.appendChild(plist);
  }

  // Menú de acciones del atleta elegido
  if (S.rpeMenuAthlete) {
    const nm = S.rpeMenuAthlete;
    const hasC = !!getComments()[today + '_' + nm];
    const back = document.createElement('div'); back.className = 'rpe-menu-back'; back.setAttribute('data-menu-close', '');
    const menu = document.createElement('div'); menu.className = 'rpe-menu'; menu.setAttribute('role', 'menu');
    menu.innerHTML = '<div class="rpe-menu-box"><div class="rpe-menu-ttl">' + escapeHtml(nm) + '</div>' +
      '<button class="comment-btn rpe-menu-item" role="menuitem" data-ath="' + escapeHtml(nm) + '"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>' + (hasC ? 'Ver o editar comentario' : 'Escribir comentario') + '</button>' +
      '<button class="rpe-menu-item" role="menuitem" data-lactate-ath="' + escapeHtml(nm) + '"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z"/></svg>Test de lactato</button></div>' +
      '<button class="rpe-menu-cancel" data-menu-close>Cancelar</button>';
    d.append(back, menu);
  }

  // Comment buttons - use event delegation to avoid timing issues
  d.addEventListener('click', function(e) {
    const moreBtn = e.target.closest('[data-more-ath]');
    if (moreBtn) { S.rpeMenuAthlete = moreBtn.dataset.moreAth; render(); return; }
    if (e.target.closest('[data-menu-close]')) { S.rpeMenuAthlete = null; render(); return; }
    if (e.target.closest('.rpe-menu')) S.rpeMenuAthlete = null;
    const lacBtn = e.target.closest('[data-lactate-ath]');
    if (lacBtn) { S.lactateModalAthlete = lacBtn.dataset.lactateAth; render(); return; }
    const btn = e.target.closest('.comment-btn');
    if (!btn) return;
    S.commentAthlete = btn.dataset.ath;
    S.commentText = getComments()[today + '_' + btn.dataset.ath] || '';
    render();
  });

  // Historical RPE — all past sessions, day by day
  const histSt = document.createElement('div'); histSt.className = 'section-title'; histSt.style.marginTop = '24px'; histSt.textContent = 'Historial RPE';
  d.appendChild(histSt);

  const allSessions = getAllSessions().filter(s => s.date !== today);
  if (allSessions.length === 0) {
    const empty = document.createElement('div'); empty.className = 'empty-state'; empty.textContent = 'No hay sesiones anteriores';
    d.appendChild(empty);
  } else {
    allSessions.forEach(s => {
      const dayRPEHist = getDayRPE(s.date);
      const pastResponses = athletes.filter(a => dayRPEHist[a]);
      let pastSum = 0, pastCount = 0;
      pastResponses.forEach(function(a) {
        rpeSubmissions(dayRPEHist[a]).forEach(function(sub) { pastSum += sub.data.rpe || 0; pastCount++; });
      });
      const pastAvg = pastCount > 0 ? (pastSum / pastCount).toFixed(1) : '—';

      const wrapper = document.createElement('div'); wrapper.className = 'hist-date-section';

      const toggle = document.createElement('div'); toggle.className = 'hist-date-toggle';
      const toggleInner = document.createElement('div'); toggleInner.style.cssText = 'display:flex;align-items:center;width:100%;gap:8px';
      const toggleLeft = document.createElement('div'); toggleLeft.style.flex = '1';
      const tgSlots = daySlots(s.data);
      const tgFirst = tgSlots.length > 0 ? tgSlots[0].sess : { title: '—', phase: '—' };
      const tgTitle = tgSlots.length > 1 ? escapeHtml(tgFirst.title) + ' (2x)' : escapeHtml(tgFirst.title);
      toggleLeft.innerHTML = '<div style="font-weight:600;font-size:0.88rem">' + formatDateLabel(s.date) + '</div><div style="font-size:0.75rem;color:var(--text2);margin-top:2px">' + tgTitle + ' · <span class=\"tag\" style=\"font-size:0.65rem\">' + tgFirst.phase + '</span></div>';
      const toggleRight = document.createElement('div'); toggleRight.style.cssText = 'text-align:right;margin-right:10px';
      toggleRight.innerHTML = '<div style="font-size:0.85rem;font-weight:700;color:' + rpeColor(parseFloat(pastAvg)) + '">' + pastAvg + '</div><div style="font-size:0.65rem;color:var(--text2)">' + pastResponses.length + '/' + athletes.length + '</div>';
      const toggleArrow = document.createElement('span'); toggleArrow.style.color = 'var(--text2)'; toggleArrow.textContent = S.rpeHistOpen[s.date] ? '\u25b2' : '\u25bc';
      toggleInner.append(toggleLeft, toggleRight, toggleArrow);
      toggle.appendChild(toggleInner);
      toggle.onclick = () => { S.rpeHistOpen[s.date] = !S.rpeHistOpen[s.date]; render(); };
      wrapper.appendChild(toggle);

      if (S.rpeHistOpen[s.date]) {
        const body = document.createElement('div'); body.className = 'hist-date-body open';

        // mini summary
        const miniSum = document.createElement('div'); miniSum.className = 'summary-row'; miniSum.style.cssText = 'margin-bottom:10px;margin-top:4px';
        const objStr = daySlots(s.data).map(function(sl){ return sl.sess.targetRPE; }).join('/') || '—';
        [{val: pastAvg, lbl:'RPE Medio'},{val: objStr, lbl:'Objetivo'},{val: pastResponses.length + '/' + athletes.length, lbl:'Respuestas'}].forEach(function(item) {
          const box = document.createElement('div'); box.className = 'summary-box';
          box.innerHTML = '<div class=\"summary-val\" style=\"font-size:1.1rem\">' + item.val + '</div><div class=\"summary-lbl\">' + item.lbl + '</div>';
          miniSum.appendChild(box);
        });
        body.appendChild(miniSum);

        const tblH = document.createElement('table'); tblH.className = 'rpe-table';
        tblH.innerHTML = '<thead><tr><th>Atleta</th><th>RPE</th><th>Estado</th><th>\u0394</th><th></th></tr></thead>';
        const tbodyH = document.createElement('tbody');
        athletes.forEach(function(name) {
          const entry = dayRPEHist[name];
          const tr = document.createElement('tr');
          const ns = shortAthleteName(name);
          if (entry) {
            const subs = rpeSubmissions(entry);
            const slotMap2 = normDay(s.data) || {};
            const circles = subs.map(function(sub) {
              return '<div class=\"rpe-circle\" style=\"background:' + rpeColor(sub.data.rpe) + ';width:26px;height:26px;font-size:0.75rem;display:inline-flex;margin-right:3px\">' + sub.data.rpe + '</div>';
            }).join('');
            const lastE = subs[subs.length-1].data;
            const fat = FATIGUE.find(function(f) { return f.v === lastE.fatigue; }) || FATIGUE[0];
            let ds2 = 0, dc2 = 0;
            subs.forEach(function(sub) {
              const t2 = slotMap2[sub.slot] ? slotMap2[sub.slot].targetRPE : null;
              if (t2) { ds2 += sub.data.rpe - t2; dc2++; }
            });
            const delta = dc2 > 0 ? Math.round(ds2/dc2) : 0;
            const deltaStr = delta > 0 ? '+'+delta : delta < 0 ? ''+delta : '=';
            const dClass2 = dc2 > 0 ? deltaClass(delta) : '';
            const hasComment = !!getComments()[s.date+'_'+name];
            const noteHtml = lastE.note ? '<div style=\"font-size:0.7rem;color:var(--text2);font-style:italic\">\"' + escapeHtml(lastE.note) + '\"</div>' : '';
            tr.innerHTML = '<td>' + escapeHtml(ns) + noteHtml + '</td><td>' + circles + '</td><td><span class=\"fatigue-label\" style=\"background:' + fat.color + '22;color:' + fat.color + ';font-size:0.7rem\">' + fat.label + '</span></td><td><span class=\"delta ' + dClass2 + '\">' + deltaStr + '</span></td><td><button class=\"comment-btn\" data-ath=\"' + escapeHtml(name) + '\" data-date=\"' + s.date + '\">' + (hasComment ? '\ud83d\udcac' : '\u270f\ufe0f') + '</button></td>';
          } else {
            tr.innerHTML = '<td>' + escapeHtml(ns) + '</td><td colspan=\"3\" style=\"color:var(--text2);font-size:0.78rem\">Sin respuesta</td><td></td>';
          }
          tbodyH.appendChild(tr);
        });
        tblH.appendChild(tbodyH);
        body.appendChild(tblH);
        wrapper.appendChild(body);
      }
      d.appendChild(wrapper);
    });
  }

  // Event delegation for ALL comment buttons (today + history)
  d.addEventListener('click', function(e) {
    const btn = e.target.closest('.comment-btn');
    if (!btn) return;
    const dateKey = btn.dataset.date || today;
    S.commentAthlete = btn.dataset.ath;
    S.commentDate = dateKey;
    S.commentText = getComments()[dateKey + '_' + btn.dataset.ath] || '';
    render();
  });

  if (S.lactateModalAthlete) d.appendChild(buildLactateModal());

  return d;
}

function timeStrToSeconds(str) {
  if (!str) return 0;
  const parts = String(str).split(':');
  if (parts.length === 2) return (parseInt(parts[0],10)||0) * 60 + (parseFloat(parts[1])||0);
  return parseFloat(str) || 0;
}

function closeLactateModal() {
  S.lactateModalAthlete = null; S.lactateProtocol = null; S.lactateSteps = null;
  S.lactatePB = null; S.lactateResult = null;
  render();
}

function buildLactateModal() {
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(26,42,58,0.5); backdrop-filter:blur(4px); overflow-y:auto;';
  const card = document.createElement('div');
  card.className = 'login-card';
  card.style.cssText += 'max-width:420px; width:100%; margin:auto; text-align:left; max-height:88vh; overflow-y:auto;';

  const h3 = document.createElement('h2'); h3.style.cssText = 'text-align:center';
  h3.textContent = 'Test de lactato — ' + S.lactateModalAthlete.split(' ')[0];
  card.appendChild(h3);

  const closeX = document.createElement('button');
  closeX.textContent = '✕ Cerrar'; closeX.className = 'btn btn-secondary'; closeX.style.marginBottom = '14px';
  closeX.onclick = closeLactateModal;
  card.appendChild(closeX);

  // ── Paso 1: elegir protocolo (con historial previo si existe) ──
  if (!S.lactateProtocol) {
    const athleteObj0 = DATA.athletes.find(function(a){ return a.name === S.lactateModalAthlete; });
    if (!DATA.lactateHistByAthlete) DATA.lactateHistByAthlete = {};
    if (athleteObj0 && DATA.lactateHistByAthlete[athleteObj0.id] === undefined) {
      DATA.lactateHistByAthlete[athleteObj0.id] = null;
      dbGetLactateTests(athleteObj0.id).then(function(rows) { DATA.lactateHistByAthlete[athleteObj0.id] = rows || []; render(); }).catch(function(){ DATA.lactateHistByAthlete[athleteObj0.id] = []; });
    }
    const histRows = athleteObj0 ? DATA.lactateHistByAthlete[athleteObj0.id] : null;
    if (histRows && histRows.length > 0) {
      const histSt = document.createElement('div'); histSt.style.cssText = 'font-size:0.7rem;font-weight:700;color:var(--text2);margin-bottom:6px;text-transform:uppercase';
      histSt.textContent = 'Tests previos';
      card.appendChild(histSt);
      histRows.forEach(function(row) {
        const p = LACTATE_PROTOCOLS[row.protocol] || {};
        const hr = document.createElement('div'); hr.style.cssText = 'display:flex;justify-content:space-between;font-size:0.78rem;padding:6px 0;border-bottom:1px solid rgba(100,140,180,0.12);cursor:pointer';
        hr.innerHTML = '<span>' + formatDateLabel(row.date) + ' · ' + escapeHtml(p.label || row.protocol) + '</span><strong>' + escapeHtml(row.threshold_pace100) + ' →</strong>';
        hr.onclick = function() {
          S.lactateProtocol = row.protocol;
          S.lactateResult = {
            threshold: { v: row.threshold_speed, pace100: row.threshold_pace100 },
            aerobic: row.aerobic_speed ? { v: row.aerobic_speed, pace100: row.aerobic_pace100 } : null,
            peak: row.peak_speed ? { v: row.peak_speed, pace100: row.peak_pace100 } : null,
            zones: calcLactateZones(row.threshold_speed),
            steps: row.steps, date: row.date, protocol: row.protocol
          };
          render();
        };
        card.appendChild(hr);
      });
      const spacer = document.createElement('div'); spacer.style.height = '10px'; card.appendChild(spacer);
    }
    Object.keys(LACTATE_PROTOCOLS).forEach(function(key) {
      const p = LACTATE_PROTOCOLS[key];
      const btn = document.createElement('button');
      btn.className = 'btn btn-secondary'; btn.style.cssText = 'margin-bottom:10px;text-align:left;display:block';
      btn.innerHTML = '<strong>' + p.label + '</strong><br><span style="font-size:0.72rem;color:var(--text2)">' + p.help + '</span>';
      btn.onclick = function() {
        S.lactateProtocol = key;
        if (p.isBlock) {
          S.lactateSteps = Array.from({length:3}, function(){
            return { times: Array(8).fill(''), strokes6: '', strokes7: '', lactate: '' };
          });
          S.lactateBasal = ''; S.lactatePost3 = '';
        } else {
          S.lactateSteps = Array.from({length:p.steps}, function(){ return { time:'', lactate:'', hr:'', strokes:'' }; });
        }
        render();
      };
      card.appendChild(btn);
    });
    ov.appendChild(card);
    return ov;
  }

  const proto = LACTATE_PROTOCOLS[S.lactateProtocol];

  // ── PB si hace falta ──
  if (proto.needsPB && !S.lactatePB) {
    const lbl = document.createElement('label'); lbl.className = 'field-label'; lbl.textContent = 'PB en 100m de ' + S.lactateModalAthlete.split(' ')[0] + ' (mm:ss.d)';
    card.appendChild(lbl);
    const pbIn = document.createElement('input'); pbIn.type = 'text'; pbIn.placeholder = '1:02.50';
    pbIn.oninput = function(e) { S._pbTemp = e.target.value; };
    card.appendChild(pbIn);
    const okBtn = document.createElement('button'); okBtn.className = 'btn btn-primary'; okBtn.textContent = 'Continuar'; okBtn.style.marginTop = '10px';
    okBtn.onclick = function() {
      const s = timeStrToSeconds(S._pbTemp);
      if (!s) { alert('Ingresá el PB en formato mm:ss'); return; }
      S.lactatePB = s; render();
    };
    card.appendChild(okBtn);
    ov.appendChild(card);
    return ov;
  }

  // ── Paso 2: carga de escalones ──
  if (!S.lactateResult) {
    if (proto.isBlock) {
      const lblB = document.createElement('label'); lblB.className = 'field-label'; lblB.textContent = 'Lactato basal (mmol/L)';
      card.appendChild(lblB);
      const inB = document.createElement('input'); inB.type = 'number'; inB.step = '0.1'; inB.value = S.lactateBasal || '';
      inB.oninput = function(e){ S.lactateBasal = e.target.value; };
      card.appendChild(inB);
    }
    S.lactateSteps.forEach(function(step, i) {
      const wrap = document.createElement('div'); wrap.style.cssText = 'border-top:1px solid rgba(100,140,180,0.15);padding-top:10px;margin-top:10px';
      const lbl = document.createElement('div'); lbl.style.cssText = 'font-weight:700;font-size:0.85rem;margin-bottom:6px';
      lbl.textContent = proto.isBlock ? ('Bloque ' + (i+1) + ' (8×100)') : ('Escalón ' + (i+1) + ' — ' + proto.distance + 'm');
      wrap.appendChild(lbl);

      if (proto.isBlock) {
        // 8 tiempos individuales, con brazadas solo en las reps 6 y 7
        step.times.forEach(function(_, repIdx) {
          const repRow = document.createElement('div'); repRow.style.cssText = 'display:flex;gap:6px;align-items:center;margin-bottom:4px';
          const repLbl = document.createElement('span'); repLbl.style.cssText = 'width:22px;font-size:0.72rem;color:var(--text2)'; repLbl.textContent = (repIdx+1) + '.';
          repRow.appendChild(repLbl);
          const tIn = document.createElement('input'); tIn.type = 'text'; tIn.placeholder = 'mm:ss'; tIn.style.cssText = 'flex:1;min-width:70px';
          tIn.value = step.times[repIdx];
          tIn.oninput = function(e){ step.times[repIdx] = e.target.value; };
          repRow.appendChild(tIn);
          if (repIdx === 5 || repIdx === 6) { // reps 6 y 7 (0-index 5,6)
            const key = repIdx === 5 ? 'strokes6' : 'strokes7';
            const sIn = document.createElement('input'); sIn.type = 'number'; sIn.placeholder = 'Brazadas'; sIn.style.cssText = 'width:80px';
            sIn.value = step[key];
            sIn.oninput = function(e){ step[key] = e.target.value; };
            repRow.appendChild(sIn);
          }
          wrap.appendChild(repRow);
        });
        const lacIn = document.createElement('input'); lacIn.type = 'number'; lacIn.step = '0.1'; lacIn.placeholder = 'Lactato del bloque (mmol/L)'; lacIn.style.cssText = 'width:100%;margin-top:6px';
        lacIn.value = step.lactate;
        lacIn.oninput = function(e){ step.lactate = e.target.value; };
        wrap.appendChild(lacIn);
        card.appendChild(wrap);
        return;
      }

      const row = document.createElement('div'); row.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap';
      [['time','Tiempo (mm:ss)','text'],['lactate','Lactato (mmol/L)','number'],['hr','Pulso','number'],['strokes','Brazadas','number']].forEach(function(f) {
        const inp = document.createElement('input');
        inp.type = f[2]; inp.placeholder = f[1]; inp.style.cssText = 'flex:1;min-width:80px';
        inp.value = step[f[0]];
        inp.oninput = function(e){ step[f[0]] = e.target.value; };
        row.appendChild(inp);
      });
      wrap.appendChild(row);
      card.appendChild(wrap);
    });
    if (proto.isBlock) {
      const lblP = document.createElement('label'); lblP.className = 'field-label'; lblP.style.marginTop = '10px'; lblP.textContent = "Lactato a los 3' post-esfuerzo (mmol/L)";
      card.appendChild(lblP);
      const inP = document.createElement('input'); inP.type = 'number'; inP.step = '0.1'; inP.value = S.lactatePost3 || '';
      inP.oninput = function(e){ S.lactatePost3 = e.target.value; };
      card.appendChild(inP);
    }

    const saveBtn = document.createElement('button'); saveBtn.className = 'btn btn-primary'; saveBtn.textContent = 'Calcular y guardar'; saveBtn.style.marginTop = '14px';
    saveBtn.onclick = async function() {
      let calcSteps;
      if (proto.isBlock) {
        // 3 puntos de intensidad reales; tiempo del bloque = suma de las 8 marcas reales
        calcSteps = S.lactateSteps.map(function(step, i) {
          const distTotal = 800;
          const t = step.times.reduce(function(sum, ts){ return sum + timeStrToSeconds(ts); }, 0);
          let lac = parseFloat(step.lactate) || 0;
          if (i === S.lactateSteps.length - 1 && S.lactatePost3) lac = Math.max(lac, parseFloat(S.lactatePost3));
          return { distance: distTotal, time_s: t, lactate: lac, strokes_rep6: step.strokes6 || null, strokes_rep7: step.strokes7 || null };
        });
      } else {
        calcSteps = S.lactateSteps.map(function(step) {
          return { distance: proto.distance, time_s: timeStrToSeconds(step.time), lactate: parseFloat(step.lactate) || 0 };
        });
      }
      const th = calcLactateThreshold(calcSteps);
      const aero = calcAerobicThreshold(calcSteps);
      const peak = calcPeakVelocity(calcSteps);
      const zones = th ? calcLactateZones(th.v) : null;
      S.lactateResult = { threshold: th, aerobic: aero, peak: peak, zones: zones, steps: calcSteps, date: todayStr(), protocol: S.lactateProtocol };
      if (!th) { render(); return; }
      const athleteObj = DATA.athletes.find(function(a){ return a.name === S.lactateModalAthlete; });
      try {
        await dbSaveLactateTest({
          athlete_id: athleteObj.id,
          protocol: S.lactateProtocol,
          pb100: S.lactatePB || null,
          steps: calcSteps,
          threshold_speed: th.v,
          threshold_pace100: th.pace100,
          aerobic_speed: aero ? aero.v : null,
          aerobic_pace100: aero ? aero.pace100 : null,
          peak_speed: peak ? peak.v : null,
          peak_pace100: peak ? peak.pace100 : null
        });
      } catch (e) { track('api_error', { path: 'lactate_tests', status: 0 }); }
      render();
    };
    card.appendChild(saveBtn);
    ov.appendChild(card);
    return ov;
  }

  // ── Paso 3: resultado ──
  if (!S.lactateResult.threshold) {
    const warn = document.createElement('div'); warn.style.cssText = 'color:#c0392b;font-weight:700;padding:10px 0';
    warn.textContent = 'El lactato nunca cruzó 4.0 mmol/L con estos datos — revisá los valores cargados.';
    card.appendChild(warn);
  } else {
    const res = document.createElement('div'); res.className = 'card'; res.style.cssText = 'padding:14px';
    let rows = '<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(100,140,180,0.15)">' +
      '<span style="font-size:0.78rem;color:var(--text2)">Umbral aeróbico (LT1, 2.0 mmol/L)</span>' +
      '<strong>' + (S.lactateResult.aerobic ? S.lactateResult.aerobic.pace100 : '—') + '</strong></div>' +
      '<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(100,140,180,0.15)">' +
      '<span style="font-size:0.78rem;color:#1e8449;font-weight:700">Umbral anaeróbico (OBLA, 4.0 mmol/L)</span>' +
      '<strong style="color:#1e8449">' + S.lactateResult.threshold.pace100 + '</strong></div>' +
      '<div style="display:flex;justify-content:space-between;padding:5px 0">' +
      '<span style="font-size:0.78rem;color:var(--text2)">Velocidad pico del test (no es VO2max)</span>' +
      '<strong>' + (S.lactateResult.peak ? S.lactateResult.peak.pace100 : '—') + '</strong></div>';
    res.innerHTML = rows;
    card.appendChild(res);

    const vT = S.lactateResult.threshold.v;
    const athObj = (DATA.athletes || []).find(function (a) { return a.name === S.lactateModalAthlete; });
    const histR = athObj && DATA.lactateHistByAthlete ? DATA.lactateHistByAthlete[athObj.id] : null;
    const zt = document.createElement('div'); zt.style.marginTop = '12px';
    zt.innerHTML = lactateCompare(S.lactateResult, histR) + buildLactatePaceTable(vT);
    card.appendChild(zt);
    const zn = document.createElement('div'); zn.style.cssText = 'font-size:0.72rem;color:var(--text3);margin-top:6px';
    zn.textContent = 'Zonas orientativas, en % de su ritmo a 4 mmol/L. En el gráfico, la banda verde marca dónde está probablemente su umbral real (3–5 mmol/L). Fuentes: Ayuda > Test de lactato.';
    card.appendChild(zn);
    const zs = document.createElement('div'); zs.innerHTML = buildLactateSets(S.lactateResult.threshold.v); card.appendChild(zs);
    card.appendChild(buildLactateChart(S.lactateResult.steps, S.lactateResult.threshold, S.lactateResult.aerobic));
  }
  const doneBtn = document.createElement('button'); doneBtn.className = 'btn btn-primary'; doneBtn.textContent = 'Listo'; doneBtn.style.marginTop = '14px';
  doneBtn.onclick = closeLactateModal;
  card.appendChild(doneBtn);
  ov.appendChild(card);
  return ov;
}

// BIENESTAR HOY (Escuadra): check-in vs. su media + ACWR + RPE y cansancio

async function dbGetTeamWellness(days) {
  const from = new Date(); from.setDate(from.getDate() - (days - 1));
  const fromS = from.getFullYear()+'-'+String(from.getMonth()+1).padStart(2,'0')+'-'+String(from.getDate()).padStart(2,'0');
  const rows = await sbFetchAll('wellness_entries?select=date,sleep,soreness,fatigue,stress,athletes(name)&date=gte.' + fromS + '&order=date.asc,id.asc');
  const map = {};
  (rows || []).forEach(function(r) {
    const name = r.athletes && r.athletes.name;
    if (!name) return;
    (map[name] = map[name] || []).push({ date: r.date, sleep: r.sleep, soreness: r.soreness, fatigue: r.fatigue, stress: r.stress });
  });
  return map;
}

// Análisis de un nadador con la ventana de las últimas 72 h (hoy y los 2 días anteriores).
// Un día malo suelto no sale en la lista (se cuenta aparte). Señales:
//  · Cansado/Agotado (4–5) en el RPE 2 de los últimos 3 días → hablar con él.
//  · RPE de una sesión ≥ objetivo + 2, 2 de los últimos 3 días → ajustar hoy.
//  · Bienestar bajo su media 2 de 3 días, o sueño / músculos ≤ 2 dos de los 3 días → hablar con él.
//    Día bajo = total ≤ su media − max(1 DE, 2 puntos), con sus check-ins de 28 días
//    (mín. 7; si no, total ≤ 10).
//  · Nota del RPE con agotamiento, ánimo hundido o dolor en 72 h → siempre, con la frase.
//  · ACWR nunca saca a nadie solo: con ≥ 3 semanas de historia y ≥ 16 días con carga,
//    un ACWR ≥ 1,5 se suma como "Carga alta" a quien ya tiene otra señal.
// Cortes orientativos para decidir con quién hablar o qué ajustar, no para predecir lesiones.
const WELL_DISTRESS_RE = /no puedo m[aá]s|no aguanto|no llego|muert[oa]|💀|reventad|destrozad|hech[oa] polvo|fatal|mi vida|agobi|ansiedad|llor|no me apetece nada|quiero dejar/i;
const WELL_PAIN_RE = /duel[eo]n?|dolor|molesti|lesi[oó]n|pinchazo|tend[oó]n|tendin/i;
function wellnessStatusA(name, acwrItem) {
  const today = todayStr();
  const hist = (DATA.teamWellHist && DATA.teamWellHist[name]) || [];
  const todayW = getDayWellness(today)[name] || hist.find(function(h) { return h.date === today; }) || null;
  const comp = wellComposite(todayW);
  const byDate = {}; hist.forEach(function(h) { byDate[h.date] = h; });
  if (todayW) byDate[today] = todayW;
  // Base personal: media y DE de sus check-ins de 28 días, sin los 4 últimos (los que se evalúan)
  const recentDates = [0, 1, 2, 3].map(function(i) { return dateOffsetA(today, -i); });
  const prev = hist.filter(function(h) { return recentDates.indexOf(h.date) === -1; }).map(wellComposite).filter(function(c) { return c != null; });
  let base = null, sd = null;
  if (prev.length >= 7) {
    base = prev.reduce(function(a, b) { return a + b; }, 0) / prev.length;
    sd = Math.sqrt(prev.reduce(function(a, b) { return a + Math.pow(b - base, 2); }, 0) / (prev.length - 1));
    base = Math.round(base * 10) / 10;
  }
  const cut = base != null ? base - Math.max(sd, 2) : 10;
  const isLow = function(c) { return c != null && c <= cut; };
  // "Muy por debajo": el doble del margen normal (solo con media propia)
  const cutVery = base != null ? base - 2 * Math.max(sd, 2) : null;
  const isVeryLow = function(c) { return cutVery != null && c != null && c <= cutVery; };
  const days3 = [0, 1, 2].map(function(i) { return dateOffsetA(today, -i); });
  const lowToday = isLow(comp) || !!(todayW && ((todayW.sleep != null && todayW.sleep <= 2) || (todayW.soreness != null && todayW.soreness <= 2)));
  const lowDays = days3.filter(function(d) { return isLow(wellComposite(byDate[d])); }).length;
  const lowSustained = lowDays >= 2;
  // Criterio "evidente": solo lo extremo o lo que se mantiene los 3 días
  const lowAll3 = base != null && lowDays >= 3;
  const veryLowDays = days3.filter(function(d) { return isVeryLow(wellComposite(byDate[d])); }).length;
  const veryLow = veryLowDays >= 2;
  const onesDays = days3.filter(function(d) { const x = byDate[d]; return x && WELL_QS.some(function(q) { return x[q.key] === 1; }); }).length;
  const onesSustained = onesDays >= 2;
  const lowItems = todayW ? WELL_QS.filter(function(q) { return todayW[q.key] != null && todayW[q.key] <= 2; }) : [];
  const midItems = todayW ? WELL_QS.filter(function(q) { return todayW[q.key] === 3; }) : [];
  // Sueño o músculos en 1–2: cuenta si se repite 2 de los 3 días (un día malo suelto no sale)
  const keyLowDays = days3.filter(function(d) { const x = byDate[d]; return x && ((x.sleep != null && x.sleep <= 2) || (x.soreness != null && x.soreness <= 2)); }).length;
  const keyLow = keyLowDays >= 2 ? WELL_QS.filter(function(q) { return (q.key === 'sleep' || q.key === 'soreness') && todayW && todayW[q.key] != null && todayW[q.key] <= 2; }) : [];
  const keyLowSustained = keyLowDays >= 2;

  // RPE de las últimas 72 h: cansancio, RPE por encima del objetivo y notas
  const rpeHist = DATA.athleteHist[name] || [];
  const last = rpeHist.length ? rpeHist[rpeHist.length - 1] : null;
  const in3 = rpeHist.filter(function(h) { return days3.indexOf(h.date) !== -1; });
  const tiredDays = {}; const overDays = {}; const exhaustedDays = {};
  in3.forEach(function(h) {
    if (h.fatigue != null && h.fatigue >= 4) tiredDays[h.date] = true;
    if (h.fatigue != null && h.fatigue >= 5) exhaustedDays[h.date] = true;
    const day = DATA.sessions && DATA.sessions[h.date];
    const sess = day && day[h.slot];
    const target = sess && sess.targetRPE != null ? Number(sess.targetRPE) : null;
    if (target != null && h.rpe != null && h.rpe >= target + 2) overDays[h.date] = true;
  });
  const tiredStreak = Object.keys(tiredDays).length;
  const tired = tiredStreak >= 2;                 // ya NO alerta solo: cuenta para el aviso de grupo
  const exhaustedCount = Object.keys(exhaustedDays).length;
  const exhausted = exhaustedCount >= 2;
  const overCount = Object.keys(overDays).length;
  const rpeOver = overCount >= 2;
  const notes = in3.filter(function(h) { return h.note && h.note.trim(); });
  const distressNote = notes.filter(function(h) { return WELL_DISTRESS_RE.test(h.note); }).pop() || null;
  const painNote = notes.filter(function(h) { return WELL_PAIN_RE.test(h.note); }).pop() || null;
  const painRepeated = !!painNote;

  // ACWR: solo apoyo, nunca señal propia, y solo con historia suficiente
  const acwrNum = acwrItem ? (typeof acwrItem.raw === 'number' ? acwrItem.raw : acwrItem.raw && acwrItem.raw.value) : null;
  const calibrated = !!(acwrItem && acwrItem.info && !acwrItem.info.calibrating);
  const loadDates = Object.keys(rpeHist.reduce(function(m, h) { m[h.date] = 1; return m; }, {})).sort();
  const reliable = calibrated && loadDates.length >= 16 && loadDates[0] <= dateOffsetA(today, -21);
  const talk = exhausted || veryLow || lowAll3 || onesSustained || !!distressNote || painRepeated;
  const acwrHigh = reliable && acwrNum != null && acwrNum >= 1.5 && (talk || rpeOver);
  const adjust = rpeOver || acwrHigh;
  return { name: name, todayW: todayW, comp: comp, base: base, sd: sd, lowItems: lowItems, midItems: midItems, keyLow: keyLow,
    below: lowToday, lowToday: lowToday, lowDays: lowDays, lowSustained: lowSustained,
    last: last, lastFat: last ? (FATIGUE.find(function(f) { return f.v === last.fatigue; }) || null) : null,
    tiredStreak: tiredStreak, tired: tired, rpeOver: rpeOver, overCount: overCount,
    distressNote: distressNote, painRepeated: painRepeated, painNote: painNote,
    acwrItem: acwrItem, acwrNum: acwrNum, acwrHigh: acwrHigh, acwrLimit: false, acwrNear: false, acwrReliable: reliable,
    exhausted: exhausted, exhaustedCount: exhaustedCount, veryLow: veryLow, veryLowDays: veryLowDays, lowAll3: lowAll3,
    onesSustained: onesSustained, onesDays: onesDays,
    adjust: adjust, talk: talk, flagged: adjust || talk, hist: hist };
}

function buildWellnessBlockA(acwrData) {
  const wrap = document.createElement('div');
  const athletes = getAthletes();
  const byName = {}; (acwrData || []).forEach(function(x) { byName[x.name] = x; });
  const all = athletes.map(function(n) { return wellnessStatusA(n, byName[n]); });
  const withCheckin = all.filter(function(s) { return s.comp != null; }).length;
  const flagged = all.filter(function(s) { return s.flagged; }).sort(function(a, b) {
    const pr = function(x) { return x.painNote || x.adjust ? 0 : x.exhausted || x.distressNote || x.onesSustained ? 1 : 2; }; const pa = pr(a), pb = pr(b);  // rojo, naranja, azul
    if (pa !== pb) return pa - pb;
    return (a.comp == null ? 99 : a.comp) - (b.comp == null ? 99 : b.comp);
  });
  const nAdjust = flagged.filter(function(s) { return s.adjust; }).length;
  const nOneDay = all.filter(function(s) { return s.lowToday && !s.flagged; }).length;
  // Aviso de grupo: si mucha gente marca cansancio, es la carga del grupo, no casos aislados
  const withData = all.filter(function(s) { return s.comp != null || s.last; }).length;
  const nTired = all.filter(function(s) { return s.tired; }).length;
  const groupTired = withData > 0 && nTired >= 3 && nTired / withData >= 0.4;

  const head = document.createElement('div'); head.className = 'bw-head';
  head.innerHTML = '<div class="section-title">Bienestar hoy</div><small>últimas 72 h · solo lo evidente</small>';
  wrap.appendChild(head);
  const card = document.createElement('div'); card.className = 'card bw-card';
  let html = '<div class="bw-sum">'
    + '<span>Check-in<b>' + withCheckin + '/' + athletes.length + '</b></span>'
    + '<span>A vigilar<b style="color:' + (flagged.length ? 'var(--orange)' : 'var(--text)') + '">' + flagged.length + '</b></span>'
    + '<span>Ajustar hoy<b style="color:' + (nAdjust ? 'var(--red)' : 'var(--text)') + '">' + nAdjust + '</b></span></div>';
  if (groupTired) html += '<div class="bw-group" role="status"><b>Semana exigente:</b> ' + nTired + ' de ' + withData + ' marcan cansancio 2 de los últimos 3 días. Es la carga del grupo, no casos aislados.</div>';
  const ink = function(label) { return { 'Riesgo': '#e5484d', 'Atención': '#d97706', 'Óptimo': '#0f9d58', 'Subcarga': '#0a84ff', 'Calibrando': '#7d93a8' }[label] || 'var(--text)'; };
  flagged.forEach(function(s) {
    const scoreHtml = s.comp != null
      ? '<div class="bw-score" style="background:' + wellCompColor(s.comp) + '">' + s.comp + '<small>/20</small></div>'
      : '<div class="bw-score none">—</div>';
    const baseTxt = s.comp == null ? 'Sin check-in hoy'
      : (s.base != null ? 'Su media ' + String(s.base).replace('.', ',') + ' · ' + (s.comp - s.base >= 0 ? '+' : '−') + String(Math.abs(Math.round((s.comp - s.base) * 10) / 10)).replace('.', ',') : 'Todavía sin media (menos de 7 check-ins)');
    const metrics = '<div class="bw-metrics">'
      + '<div>ACWR<b style="color:' + (s.acwrItem ? ink(s.acwrItem.info.label) : 'var(--text2)') + '">' + (s.acwrNum != null ? Number(s.acwrNum).toFixed(2) : '—') + '</b></div>'
      + '<div>Últ. RPE<b' + (s.last ? ' style="color:' + rpeColor(s.last.rpe) + '"' : '') + '>' + (s.last ? s.last.rpe : '—') + '</b></div>'
      + '<div>Estado<b' + (s.lastFat ? ' style="color:' + s.lastFat.color + '"' : '') + '>' + (s.lastFat ? s.lastFat.label : '—') + '</b></div></div>';
    let chips = '';
    s.lowItems.forEach(function(q) { chips += '<span class="bw-chip low">' + q.lbl + ' ' + s.todayW[q.key] + '</span>'; });
    // Un mensaje por motivo: qué pasa y qué hacer. Color = urgencia (rojo, naranja, azul).
    const msg = function(color, title, action) { return '<span class="bw-flag" style="background:' + color + '"><b>' + title + '</b> · ' + action + '</span>'; };
    const RED = 'var(--red)', ORANGE = 'var(--orange)', BLUE = '#0a84ff';
    if (s.painNote) chips += msg(RED, 'Dolor', 'revisar antes de entrenar');
    if (s.rpeOver) chips += msg(RED, 'Ajustar hoy', 'bajar intensidad: RPE +2 sobre el objetivo ' + s.overCount + ' de 3 días');
    else if (s.acwrHigh) chips += msg(RED, 'Ajustar hoy', 'carga alta (ACWR ' + String(Number(s.acwrNum).toFixed(2)).replace('.', ',') + ') y otra señal');
    if (s.exhausted) chips += msg(ORANGE, 'Agotamiento', 'valorar menos volumen y preguntar cómo recupera');
    if (s.distressNote) chips += msg(ORANGE, 'Ánimo bajo', 'hablar en privado');
    if (s.veryLow || s.lowAll3) {
      // ítem más bajo de los últimos 3 días
      const recent = (s.hist || []).filter(function (h) { return [0, 1, 2].map(function (i) { return dateOffsetA(todayStr(), -i); }).indexOf(h.date) !== -1; });
      if (s.todayW) recent.push(s.todayW);
      let worst = null;
      WELL_QS.forEach(function (q) {
        const vals = recent.map(function (h) { return h[q.key]; }).filter(function (v) { return v != null; });
        if (!vals.length) return;
        const avg = vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
        if (!worst || avg < worst.avg) worst = { lbl: q.lbl, avg: avg };
      });
      chips += msg(BLUE, 'Bienestar bajo', (s.veryLow ? 'muy por debajo de su media' : 'bajo su media los 3 días') + (worst ? ': preguntar por ' + worst.lbl.toLowerCase() : ''));
    }
    if (s.onesSustained) {
      const lbls = WELL_QS.filter(function (q) { return s.todayW && s.todayW[q.key] === 1; }).map(function (q) { return q.lbl; });
      chips += msg(ORANGE, (lbls.length ? lbls.join(' y ') : 'Algún ítem') + ' en 1', 'preguntar qué pasa');
    }
    const q = s.distressNote || s.painNote;
    if (q) chips += '<div class="bw-quote">«' + escapeHtml(q.note.trim().slice(0, 110)) + '» <span>' + escapeHtml(formatDateLabel(q.date)) + '</span></div>';
    html += '<div class="bw-row">' + scoreHtml + '<div class="bw-main"><div class="bw-name">' + escapeHtml(s.name) + '</div><div class="bw-base">' + baseTxt + '</div>'
      + metrics + (chips ? '<div class="bw-chips">' + chips + '</div>' : '') + '</div>'
      + '<button class="rpe-more" data-bw-ath="' + escapeHtml(s.name) + '" aria-label="Detalle de ' + escapeHtml(s.name) + '"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button></div>';
  });
  const okCount = athletes.length - flagged.length;
  if (!flagged.length) {
    html += '<div class="bw-ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Todo el equipo está en su línea</div>';
  } else if (okCount > 0) {
    html += '<div class="bw-ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Los otros ' + okCount + ' están en su línea</div>';
  }
  if (nOneDay) html += '<div class="bw-oneday">' + nOneDay + (nOneDay === 1 ? ' nadador tiene' : ' nadadores tienen') + ' hoy un día bajo suelto: no sale en la lista hasta que se repita.</div>';
  card.innerHTML = html;
  wrap.appendChild(card);
  const disc = document.createElement('div'); disc.className = 'bw-disc';
  disc.textContent = 'Para ajustar la sesión del día y hablar con el nadador, no para predecir lesiones.';
  wrap.appendChild(disc);

  // Detalle del nadador elegido: 14 días de check-in, respuestas de hoy, últimos RPE y comentario
  card.addEventListener('click', function(e) {
    const b = e.target.closest('[data-bw-ath]');
    if (b) { S.bwDetail = b.dataset.bwAth; render(); }
  });
  if (S.bwDetail) {
    const s = all.find(function(x) { return x.name === S.bwDetail; });
    if (s) wrap.appendChild(buildWellnessDetailA(s));
  }
  return wrap;
}

function buildWellnessDetailA(s) {

  const menu = document.createElement('div'); menu.className = 'rpe-menu bw-detail'; menu.setAttribute('role', 'dialog');
  // Mini línea de 14 días con su media punteada
  const today = todayStr();
  const pts = [];
  for (let i = 13; i >= 0; i--) {
    const ds = dateOffsetA(today, -i);

    pts.push(wellComposite(w));
  }
  const W = 280, H = 56, y = function(v) { return H - 4 - ((v - 4) / 16) * (H - 8); };

    dots += '<circle cx="' + xs(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="' + (i === 13 ? 4 : 2.5) + '" fill="' + (i === 13 ? wellCompColor(v) : '#0a84ff') + '"/>';

  const items = WELL_QS.map(function(q) {

  }).join('');

    + '<div class="spark"><div class="lbl"><span>Check-in · últimos 14 días</span><span>' + (s.base != null ? 'media ' + String(s.base).replace('.', ',') : 'sin media') + '</span></div>'
    + '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' + baseLine + (path ? '<path d="' + path + '" fill="none" stroke="#0a84ff" stroke-width="2" stroke-linejoin="round"/>' : '') + dots + '</svg></div>'
    + '<div class="items4">' + items + '</div>'
    + (rpeRows ? '<div class="rpelist">' + rpeRows + '</div>' : '')
    + '<button class="rpe-menu-item" data-bw-comment="1"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>Escribir comentario a ' + escapeHtml(s.name.split(' ')[0]) + '</button></div>'
    + '<button class="rpe-menu-cancel" data-bw-close="1">Cerrar</button>';

    if (e.target.closest('[data-bw-comment]')) {
